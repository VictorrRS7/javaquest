/* ==========================================================================
   JavaQuest : l'appli (chemin de leçons, lecteur de leçon, pratique, profil)
   Chaque unité (chapitre) est découpée automatiquement en leçons courtes :
     📖 Découvrir     : cartes d'explication + premières questions
     🎯 S'entraîner   : le reste des questions
     ⌨️ Coder         : les exercices où l'on écrit du vrai code
   puis le mini-projet et les contrôles, en étapes facultatives.
   ========================================================================== */

/* ---------- Découpage des unités en leçons ---------- */
function isCode(e) { return e.k === "code" || e.k === "web"; }
function lessonsOf(c)
{
	if (c._lecons) { return c._lecons; }
	var quiz = c.exos.filter(function (e) { return !isCode(e); });
	var code = c.exos.filter(isCode);
	var cartes = c.idee.map(function (t, i) { return { carte: true, titre: c.titre, num: i + 1, texte: t }; });
	var exemple = { carte: true, exemple: true, titre: "Exemple à lire", ex: c.exemple };
	var moitie = Math.ceil(quiz.length / 2);
	var A = quiz.slice(0, moitie), B = quiz.slice(moitie);
	var items = [];
	if (cartes[0]) { items.push(cartes[0]); }
	if (A[0]) { items.push(A[0]); }
	if (cartes[1]) { items.push(cartes[1]); }
	if (A[1]) { items.push(A[1]); }
	if (cartes[2]) { items.push(cartes[2]); }
	items.push(exemple);
	items = items.concat(A.slice(2));
	var L = [{ id: c.id + "-1", kind: "decouvrir", titre: "Découvrir", items: items, unite: c }];
	if (B.length) { L.push({ id: c.id + "-2", kind: "entrainer", titre: "S'entraîner", items: [{ carte: true, rappel: true, titre: "Rappel", lignes: c.idee }].concat(B), unite: c }); }
	if (code.length)
	{
		L.push({ id: c.id + "-3", kind: "coder", titre: "Coder", unite: c, items: [{ carte: true, titre: "À toi de coder", texte: "Dans cette leçon, tu écris du vrai code. Il est exécuté ici, dans le navigateur, puis comparé à ce qui est attendu. Les cœurs ne sont pas en jeu : essaie, lis les erreurs et corrige. C'est comme ça qu'on apprend." }].concat(code) });
	}
	c._lecons = L;
	return L;
}
var KIND_ICON = { decouvrir: "📖", entrainer: "🎯", coder: "⌨️", projet: "🧩", controle: "⏱", final: "🏆" };
function allLessons() { var out = []; CH.forEach(function (c) { out = out.concat(lessonsOf(c)); }); return out; }
function lessonDone(id) { return !!(state.lessons[id] && state.lessons[id].fait); }
function lessonOpen(l)
{
	if (allOpen()) { return true; }
	var all = allLessons(), i = all.indexOf(l);
	if (i <= 0 || lessonDone(all[i - 1].id) || lessonDone(l.id)) { return true; }
	/* Une leçon ajoutée plus tard (nouvelle unité) ne doit pas reverrouiller ce
	   qu'on a déjà atteint : si une leçon plus loin est faite, celle-ci reste ouverte. */
	for (var k = i + 1; k < all.length; k++) { if (lessonDone(all[k].id)) { return true; } }
	return false;
}
function uniteDone(c) { return lessonsOf(c).every(function (l) { return lessonDone(l.id); }); }
function chapIndex(id) { for (var i = 0; i < CH.length; i++) { if (CH[i].id === id) { return i; } } return -1; }
function ctlOpen(ct) { var i = chapIndex(ct.apres); return allOpen() || (i >= 0 && uniteDone(CH[i])); }
function ctlState(ct) { if (!state.ctl[ct.id]) { state.ctl[ct.id] = {}; } return state.ctl[ct.id]; }
function nextLesson() { var all = allLessons(); for (var i = 0; i < all.length; i++) { if (!lessonDone(all[i].id) && lessonOpen(all[i])) { return all[i]; } } return null; }
function findLesson(id) { var r = null; LANGS.forEach(function (L) { (L.unites || []).forEach(function (c) { lessonsOf(c).forEach(function (l) { if (l.id === id) { r = { l: l, langue: L }; } }); }); }); return r; }
function revOk(id) { var r = EX[id]; return r && r.chap && !r.projet && !isCode(r.ex) && r.langue === lang(); }
function reviewIds() { return Object.keys(state.rev).filter(function (id) { return revOk(id) && revDue(id); }); }
function reviewLater() { return Object.keys(state.rev).filter(function (id) { return revOk(id) && !revDue(id); }).length; }
/* ---------- Progression ---------- */
function progRow(label, d, t)
{
	var pct = t ? Math.round(100 * d / t) : 0;
	return h("div", { "class": "prow" },
		h("span", { "class": "grow small", text: label }),
		h("span", { "class": "progress mini", role: "progressbar", "aria-label": label, "aria-valuemin": "0", "aria-valuemax": String(t), "aria-valuenow": String(d) }, h("span", { style: "width:" + pct + "%" })),
		h("span", { "class": "small muted pnum", text: d + "/" + t }));
}
function bigProgress(titre, d, t, sous)
{
	var pct = t ? Math.round(100 * d / t) : 0;
	return h("section", { "class": "card progcard" },
		h("div", { "class": "row between" }, h("strong", { text: titre }), h("span", { "class": "pct", text: pct + " %" })),
		h("div", { "class": "progress", role: "progressbar", "aria-label": titre, "aria-valuemin": "0", "aria-valuemax": String(t), "aria-valuenow": String(d) }, h("span", { style: "width:" + pct + "%" })),
		sous ? h("p", { "class": "small muted", style: "margin:8px 0 0", text: sous }) : null);
}
function count(list) { return list.filter(function (e) { return state.done[e.id]; }).length; }
function stats()
{
	var r = { lecons: [0, 0], quiz: [0, 0], code: [0, 0], projets: [0, 0], controles: [0, 0], bonus: [0, 0] };
	CH.forEach(function (c)
	{
		lessonsOf(c).forEach(function (l) { r.lecons[1]++; if (lessonDone(l.id)) { r.lecons[0]++; } });
		c.exos.forEach(function (e) { var k = isCode(e) ? "code" : "quiz"; r[k][1]++; if (state.done[e.id]) { r[k][0]++; } });
		if (c.projet) { r.projets[1] += c.projet.etapes.length; r.projets[0] += count(c.projet.etapes); }
	});
	CT.forEach(function (ct) { var b = ctlState(ct).best; r.controles[1]++; if (b && b.nb === b.total && !b.hors) { r.controles[0]++; } });
	EV.forEach(function (ev) { r.bonus[1] += ev.etapes.length; r.bonus[0] += count(ev.etapes); });
	return r;
}
function codeTitle(e) { return e.titre || String(e.enonce || e.q || e.id).replace(/`|\*\*/g, "").split(/[.:](?:\s|$)/)[0].slice(0, 70); }

	var nbRev = reviewIds().length;

	}

	var XS = [0, 1, 2, 1, 0, -1, -2, -1];
	CH.forEach(function (c)
	{
		var ls = lessonsOf(c);
		var nbDone = ls.filter(function (l) { return lessonDone(l.id); }).length;
		app.appendChild(h("div", { "class": "unit-head" + (uniteDone(c) ? " done" : "") },
			h("div", { "class": "grow" }, h("div", { "class": "small", text: "Unité " + c.num }), h("h2", { text: c.titre }),
				h("div", { "class": "unit-bar", "aria-hidden": "true" }, h("span", { style: "width:" + Math.round(100 * nbDone / ls.length) + "%" }))),
			h("span", { "class": "unit-prog", text: uniteDone(c) ? "★ " + c.badge : nbDone + "/" + ls.length })));

		{

			wrap.appendChild(h("span", { "class": "node-label", text: label }));

		}
		ls.forEach(function (l)
		{
			var open = lessonOpen(l), done = lessonDone(l.id), cur = nx === l;
			var extra = "";

			node(done ? "✓" : open ? KIND_ICON[l.kind] : "🔒", l.titre + extra, (done ? "done" : cur ? "current" : open ? "open" : "locked") + (l.kind === "coder" ? " coder" : ""),
				function () { if (open) { go("#/lecon/" + l.id); } else { modal("🔒", "Pas encore", "Termine d'abord la leçon précédente. Pour tout ouvrir, va dans Profil > « Voir tout le parcours ».", [{ label: "Compris" }]); } },
				l.titre + ", " + (done ? "terminée" : open ? "à faire" : "verrouillée"));
		});
		var optOpen = allOpen() || uniteDone(c);
		if (c.projet)
		{
			var pdone = c.projet.etapes.every(function (e) { return state.done[e.id]; });
			node(pdone ? "✓" : optOpen ? "🧩" : "🔒", "Projet : " + c.projet.titre, "opt " + (pdone ? "done" : optOpen ? "open" : "locked"),

		{
			var open = ctlOpen(ct), st = ctlState(ct);
			var ok = st.best && st.best.nb === st.best.total && !st.best.hors;

				function () { if (open) { go("#/ctl/" + ct.id); } else { modal("🔒", ct.titre, "Il s'ouvre quand les leçons de l'unité " + c.num + " sont terminées.", [{ label: "Compris" }]); } },
				ct.titre + ", " + ct.duree + " minutes");
		});
		app.appendChild(path);
	});
}

/* ======================= Lecteur de leçon ======================= */
function lessonPlayer(cfg)
{
	// cfg : { id, titre, items, hearts (bool), onDone(stats), onQuit }
	document.body.classList.add("in-lesson");
	var queue = cfg.items.slice();
	var pos = 0, hearts = 3, requeued = {}, firstOk = {}, tried = {}, xp0 = state.xp, codeFails = 0;
	var questions = cfg.items.filter(function (x) { return !x.carte && !isCode(x); });
	var wrap = h("div", { "class": "lesson" });
	var bar = h("span");
	var heartsEl = h("span", { "class": "hearts", "aria-live": "polite" });
	var top = h("div", { "class": "lesson-top" },
		h("button", { "class": "iconbtn", "aria-label": "Quitter la leçon", text: "✕", on: { click: function ()
		{
			modal("✕", "Quitter la leçon ?", "Ce que tu as réussi reste acquis, mais la leçon ne sera pas marquée comme terminée.", [{ label: "Quitter", action: cfg.onQuit }, { label: "Continuer la leçon" }]);
		} } }),
		h("div", { "class": "lbar", role: "progressbar", "aria-label": "Avancement de la leçon" }, bar),
		heartsEl);
	var body = h("div", { "class": "lesson-body" });
	var cont = h("button", { "class": "btn big", text: "Continuer" });
	var skip = h("button", { "class": "btn ghost", text: "Passer pour l'instant", style: "display:none" });
	var foot = h("div", { "class": "lesson-foot" }, h("div", { "class": "lesson-foot-in" }, skip, cont));
	wrap.appendChild(top);
	wrap.appendChild(body);
	wrap.appendChild(foot);
	app.appendChild(wrap);
	function drawTop()
	{
		bar.style.width = Math.round(100 * pos / queue.length) + "%";
		clear(heartsEl);
		var cur = queue[pos];
		if (!cfg.hearts || (cur && isCode(cur))) { heartsEl.appendChild(h("span", { "class": "small muted", text: cfg.hearts ? "⌨️ pratique" : "" })); return; }
		heartsEl.setAttribute("aria-label", hearts + " cœur" + (hearts > 1 ? "s" : ""));
		for (var i = 0; i < 3; i++) { heartsEl.appendChild(h("span", { "class": i < hearts ? "" : "lost", "aria-hidden": "true", text: "♥" })); }
	}
	function setReady(on) { cont.disabled = !on; }
	function show()
	{
		drawTop();
		clear(body);
		skip.style.display = "none";
		codeFails = 0;
		var it = queue[pos];
		window.scrollTo(0, 0);
		if (it.carte) { body.appendChild(renderCard(it)); setReady(true); cont.focus({ preventScroll: true }); return; }
		setReady(false);
		body.appendChild(renderExercise(it, {
			lives: !!cfg.hearts,
			onSolved: function ()
			{
				if (!tried[it.id]) { firstOk[it.id] = true; if (cfg.onFirstOk) { cfg.onFirstOk(it.id); } }
				tried[it.id] = true;
				setReady(true);
				skip.style.display = "none";
			},
			onFail: function ()
			{
				hearts--;

			onAnyFail: function ()
			{
				tried[it.id] = true;

	ed.addEventListener("input", function () { saveCode(); if (web) { clearTimeout(t0); t0 = setTimeout(refresh, 300); } });
	function run()
	{
		var src = curCode();
		var r = JavaMini.run(src, { niveau: lang().niveau || 1, inputs: inBox.value === "" ? [] : inBox.value.split("\n"), markInput: true, seed: Date.now() % 100000 });
		clear(out);
		out.appendChild(h("p", { "class": "small", style: "margin:10px 0 0" }, h("strong", { text: "Sortie" })));
		out.appendChild(outputBlock(r.out));
		if (r.error) { out.appendChild(errorView(r.error, { offset: 0, lines: src.split("\n").length, src: src })); }
	}
}

			h("span", { text: "Voir tout le parcours (ouvrir toutes les leçons, projets et contrôles)" })),

function isIos() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }

{
	if (isStandalone()) { return; }

		return;
	}
	var card = h("section", { "class": "card stack" }, h("h2", { text: "📲 Installer l'appli" }));
	if (installPrompt)
	{
		card.appendChild(h("p", { "class": "small muted", text: "Ajoute JavaQuest à ton écran d'accueil : plein écran, et utilisable sans connexion." }));

	}
	else if (isIos())
	{

			h("li", { text: "Ouvre cette page dans Safari." }),
			h("li", { text: "Touche le bouton Partager (le carré avec une flèche vers le haut)." }),
			h("li", { text: "Choisis « Sur l'écran d'accueil », puis « Ajouter »." })));

	}
	else
	{
		card.appendChild(h("p", { "class": "small muted", text: "Dans le menu de ton navigateur, choisis « Installer l'application » ou « Ajouter à l'écran d'accueil »." }));

/* ---------- Sauvegarder / restaurer avec un code ---------- */
function renderBackup()
{
	var out = h("textarea", { "class": "answer", id: "bkOut", rows: "3", readonly: "readonly", spellcheck: "false", "aria-label": "Ton code de sauvegarde", hidden: "hidden" });
	var inp = h("textarea", { "class": "answer", id: "bkIn", rows: "3", spellcheck: "false", autocapitalize: "off", autocomplete: "off", placeholder: "Colle ici un code qui commence par JQ…" });
	var file = h("input", { type: "file", accept: ".txt,.json,text/plain,application/json", hidden: "hidden" });
	var msg = h("p", { "class": "small", role: "status" });
	function restore(text)
	{
		msg.textContent = "";
		readSaveCode(text).then(function (data)
		{
			modal("💾", "Restaurer cette sauvegarde ?", saveSummary(data) + "\n\nElle remplacera ta progression actuelle sur cet appareil (" + saveSummary(state) + ")", [
				{ label: "Restaurer", action: function () { loadSave(data); go("#/profil"); route(); } },
				{ label: "Annuler" }]);
		}, function (err) { msg.textContent = err.message; });
	}
	file.addEventListener("change", function ()
	{
		var f = file.files && file.files[0];
		if (!f) { return; }
		f.text().then(restore);
		file.value = "";
	});
	var copyBtn = h("button", { "class": "btn", text: "Créer mon code de sauvegarde", on: { click: function ()
	{
		saveCode().then(function (code)
		{
			state.backup = dayKey();
			save();
			out.value = code;
			out.hidden = false;
			out.focus();
			out.select();
			var done = function () { msg.textContent = "Code copié (" + Math.ceil(code.length / 1024) + " Ko de texte). Colle-le dans tes notes ou envoie-le-toi."; };
			if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code).then(done, function () { msg.textContent = "Code créé : sélectionne-le dans la case et copie-le."; }); }
			else { msg.textContent = "Code créé : sélectionne-le dans la case et copie-le."; }
			shareBtn.hidden = !navigator.share;
		});
	} } });
	var shareBtn = h("button", { "class": "btn ghost", text: "Partager…", hidden: "hidden", on: { click: function () { navigator.share({ title: "Sauvegarde JavaQuest", text: out.value }).catch(function () {}); } } });
	app.appendChild(h("section", { "class": "card stack" }, h("h2", { text: "💾 Sauvegarde" }),
		h("p", { "class": "small muted", text: "Ta progression est gardée sur cet appareil, dans ce navigateur. Pour la retrouver ailleurs (autre téléphone, appli installée, ordinateur), crée un code et colle-le là-bas. Aucune donnée n'est envoyée sur internet." }),
		h("p", { "class": "small", text: "Dernière sauvegarde : " + (state.backup ? state.backup.split("-").reverse().join("/") : "jamais") }),
		h("div", { "class": "row" }, copyBtn, shareBtn), out,
		h("label", { "class": "fld", "for": "bkIn", text: "Restaurer une sauvegarde" }), inp,
		h("div", { "class": "row" },
			h("button", { "class": "btn ghost", text: "Restaurer", on: { click: function () { restore(inp.value); } } }),
			h("button", { "class": "btn ghost", text: "Depuis un fichier", on: { click: function () { file.click(); } } }), file),
		msg));
}

function renderLangues()
{
	app.appendChild(h("div", { "class": "crumb" }, h("button", { "class": "btn ghost small", text: "← Retour", on: { click: function () { go("#/"); } } })));
	app.appendChild(h("h1", { text: "Que veux-tu apprendre ?" }));
	var grid = null, groupe = null;
	ALL_LANGS.forEach(function (L)
	{
		if (!grid || L.groupe !== groupe)
		{
			groupe = L.groupe;
			if (groupe) { app.appendChild(h("h2", { "class": "section-h", text: groupe })); }
			grid = h("div", { "class": "lang-grid" });
			app.appendChild(grid);
		}
		var on = !L.bientot && L.id === state.langue;
		var n = 0, d = 0;
		if (!L.bientot) { (L.unites || []).forEach(function (c) { lessonsOf(c).forEach(function (l) { n++; if (lessonDone(l.id)) { d++; } }); }); }
		grid.appendChild(h("button", { "class": "card langcard" + (on ? " on" : "") + (L.bientot ? " soon" : ""), disabled: !!L.bientot, "aria-pressed": on ? "true" : "false",

}
