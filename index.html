<style>
/* ==========================================================================
   JavaQuest : feuille de style
   Couleurs en variables : mode clair par défaut, mode sombre automatique
   (prefers-color-scheme) ou forcé par le bouton de thème (data-theme).
   ========================================================================== */
:root
{
	--bg: #f6f3ee;
	--surface: #fffdf9;
	--surface-2: #efe9e0;
	--ink: #1f1a14;
	--muted: #6b6157;
	--line: #ddd3c5;
	--accent: #a8470b;
	--accent-ink: #ffffff;
	--accent-soft: #f6e3d3;
	--ok: #1d7a46;
	--ok-soft: #dff2e6;
	--ko: #b42330;
	--ko-soft: #fbe1e3;
	--warn: #8a5a00;
	--warn-soft: #fbefd2;
	--code-bg: #faf6f0;
	--code-ink: #2a2118;
	--tok-kw: #9a3b06;
	--tok-str: #23703a;
	--tok-num: #6a3fb5;
	--tok-com: #8a7f73;
	--tok-type: #1f5f99;
	--focus: #1f5f99;
	--shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 4px 14px rgba(60, 40, 20, .06);
	--radius: 12px;
	--mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace;
	--sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark)
{
	:root:not([data-theme="light"])
	{
		--bg: #15120f;
		--surface: #1e1a16;
		--surface-2: #29231d;
		--ink: #f2ebe2;
		--muted: #b3a798;
		--line: #3a322a;
		--accent: #f29a52;
		--accent-ink: #1b1209;
		--accent-soft: #3a2616;
		--ok: #5fd08f;
		--ok-soft: #173826;
		--ko: #ff8a93;
		--ko-soft: #42191d;
		--warn: #f1c25b;
		--warn-soft: #3b2e10;
		--code-bg: #191511;
		--code-ink: #eee5d9;
		--tok-kw: #ffab6b;
		--tok-str: #8fdc9f;
		--tok-num: #c7a6ff;
		--tok-com: #8d8172;
		--tok-type: #86c1ff;
		--focus: #86c1ff;
		--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
		color-scheme: dark;
	}
}
:root[data-theme="dark"]
{
	--bg: #15120f;
	--surface: #1e1a16;
	--surface-2: #29231d;
	--ink: #f2ebe2;
	--muted: #b3a798;
	--line: #3a322a;
	--accent: #f29a52;
	--accent-ink: #1b1209;
	--accent-soft: #3a2616;
	--ok: #5fd08f;
	--ok-soft: #173826;
	--ko: #ff8a93;
	--ko-soft: #42191d;
	--warn: #f1c25b;
	--warn-soft: #3b2e10;
	--code-bg: #191511;
	--code-ink: #eee5d9;
	--tok-kw: #ffab6b;
	--tok-str: #8fdc9f;
	--tok-num: #c7a6ff;
	--tok-com: #8d8172;
	--tok-type: #86c1ff;
	--focus: #86c1ff;
	--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
	color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body
{
	margin: 0;
	background: var(--bg);
	color: var(--ink);
	font-family: var(--sans);
	font-size: 16px;
	line-height: 1.55;
	min-height: 100vh;
	overflow-x: hidden;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ----- En-tête ----- */
.top
{
	position: sticky;
	top: 0;
	z-index: 10;
	display: flex;
	align-items: center;
	gap: 10px;
	padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
	background: color-mix(in srgb, var(--surface) 92%, transparent);
	backdrop-filter: blur(8px);
	border-bottom: 1px solid var(--line);
}
.brand
{
	font: 700 1.05rem/1 var(--sans);
	background: none;
	border: 0;
	color: var(--ink);
	padding: 8px 4px;
	cursor: pointer;
	display: flex;
	align-items: center;
	gap: 8px;
}
.brand .logo
{
	display: inline-grid;
	place-items: center;
	width: 28px;
	height: 28px;
	border-radius: 8px;
	background: var(--accent);
	color: var(--accent-ink);
	font: 700 .8rem/1 var(--mono);
}
.top .spacer { flex: 1; }
.pill
{
	display: inline-flex;
	align-items: center;
	gap: 6px;
	font-size: .85rem;
	padding: 4px 10px;
	border-radius: 999px;
	background: var(--surface-2);
	color: var(--ink);
	white-space: nowrap;
}
.iconbtn
{
	width: 40px;
	height: 40px;
	border-radius: 10px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	cursor: pointer;
	font-size: 1.05rem;
}

/* ----- Mise en page ----- */
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; outline: none; }
.card
{
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: var(--radius);
	padding: 18px;
	margin: 0 0 16px;
	box-shadow: var(--shadow);
	min-width: 0;
}
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }

/* ----- Boutons ----- */
.btn
{
	font: 600 .95rem/1.2 var(--sans);
	border-radius: 10px;
	padding: 11px 16px;
	min-height: 44px;
	border: 1px solid transparent;
	background: var(--accent);
	color: var(--accent-ink);
	cursor: pointer;
}
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; align-self: flex-start; }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: .86rem; }
.btn.danger { background: transparent; color: var(--ko); border-color: var(--ko); }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 6px 0; text-decoration: underline; }

/* ----- Accueil ----- */
.hero { padding: 6px 0 12px; }
.hero p { color: var(--muted); max-width: 60ch; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 22px; }
.chap
{
	text-align: left;
	display: flex;
	flex-direction: column;
	gap: 6px;
	padding: 14px;
	border-radius: var(--radius);
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	font: inherit;
	cursor: pointer;
	box-shadow: var(--shadow);
	min-height: 112px;
}
.chap:hover { border-color: var(--accent); }
.chap .num { font: 600 .78rem/1 var(--mono); color: var(--muted); }
.chap .ttl { font-weight: 650; }
.chap .meta { margin-top: auto; font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.chap.locked { opacity: .55; cursor: not-allowed; box-shadow: none; }
.chap.valid { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.chap.eval { background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); }
.chap.ctl { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chap.ctl .num { color: var(--accent); }
.chap.final { grid-column: 1 / -1; min-height: 96px; background: linear-gradient(120deg, var(--accent-soft), var(--surface) 60%); border-style: solid; }
.timerbar
{
	position: sticky;
	top: 64px;
	z-index: 5;
	display: flex;
	align-items: center;
	gap: 10px;
	flex-wrap: wrap;
	padding: 10px 14px;
	margin: 0 0 14px;
	border: 1px solid var(--line);
	border-radius: var(--radius);
	background: var(--surface);
	box-shadow: var(--shadow);
}
.timerbar .time { font: 700 1.35rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.timerbar.soon .time { color: var(--warn); }
.timerbar.late { border-color: var(--ko); }
.timerbar.late .time { color: var(--ko); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 0 10px; }

/* ----- Chapitre ----- */
.crumb { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.lives { font-size: 1.1rem; letter-spacing: 2px; color: var(--ko); }
.lives .lost { color: var(--line); }
.idea { background: linear-gradient(180deg, var(--accent-soft), var(--surface) 75%); }
.idea ul { margin: 0; padding-left: 1.1em; }
.idea li + li { margin-top: 4px; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side > div { min-width: 0; }
.side .lbl { font: 600 .78rem/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
@media (max-width: 640px) { .side { grid-template-columns: 1fr; } }

.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
.step
{
	min-width: 40px;
	height: 40px;
	padding: 0 8px;
	border-radius: 10px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	font: 600 .9rem var(--sans);
	cursor: pointer;
}
.step.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.step.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.step.ko { background: var(--ko-soft); border-color: var(--ko); color: var(--ko); }
.step[disabled] { opacity: .45; cursor: not-allowed; }

.kind { display: inline-block; font: 600 .74rem/1 var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 6px; margin-bottom: 10px; }
.q { font-weight: 560; }

/* ----- Code ----- */
pre, code, textarea.editor { font-family: var(--mono); }
pre.code
{
	background: var(--code-bg);
	color: var(--code-ink);
	border: 1px solid var(--line);
	border-radius: 10px;
	padding: 12px 14px;
	margin: 10px 0;
	overflow-x: auto;
	font-size: .88rem;
	line-height: 1.55;
	tab-size: 4;
	-moz-tab-size: 4;
	white-space: pre;
	max-width: 100%;
}
code.inline { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: .9em; }
.t-kw { color: var(--tok-kw); font-weight: 600; }
.t-str { color: var(--tok-str); }
.t-num { color: var(--tok-num); }
.t-com { color: var(--tok-com); font-style: italic; }
.t-type { color: var(--tok-type); }
.t-in { font-weight: 700; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* Lignes cliquables (trouver l'erreur) */
.lines { padding: 6px 0; }
.lines button
{
	display: flex;
	width: 100%;
	text-align: left;
	background: none;
	border: 0;
	border-left: 3px solid transparent;
	color: inherit;
	font: inherit;
	padding: 1px 12px 1px 0;
	cursor: pointer;
	white-space: pre;
}
.lines button:hover { background: var(--surface-2); }
.lines .ln { display: inline-block; min-width: 2.6em; padding-right: .8em; text-align: right; color: var(--muted); user-select: none; }
.lines button.sel { background: var(--ko-soft); border-left-color: var(--ko); }
.lines button.good { background: var(--ok-soft); border-left-color: var(--ok); }

/* Trous à compléter */
input.hole[type="text"]
{
	font: inherit;
	color: var(--ink);
	background: var(--surface);
	border: 1px dashed var(--accent);
	border-radius: 5px;
	padding: 1px 4px;
	min-width: 3ch;
	box-sizing: content-box;
	vertical-align: baseline;
}
.hole::placeholder { color: var(--accent); opacity: .65; text-align: center; }
.hole:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.hole.empty { border: 2px dashed var(--ko); background: var(--ko-soft); }
pre.code.fill { white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.9; }
.fillcount { margin: 2px 0 0; }
.hole.good { border: 1px solid var(--ok); background: var(--ok-soft); }
.hole.bad { border: 1px solid var(--ko); background: var(--ko-soft); }

/* ----- QCM ----- */
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt
{
	text-align: left;
	font: inherit;
	padding: 12px 14px;
	min-height: 48px;
	border-radius: 10px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	cursor: pointer;
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.opt[disabled] { cursor: default; }
.opt code { font-size: .92em; }

/* ----- Champs ----- */
label.fld { display: block; font-weight: 600; font-size: .9rem; margin: 10px 0 4px; }
textarea, input[type="text"], input[type="password"], input[type="number"], input[type="search"], select
{
	font: inherit;
	width: 100%;
	color: var(--ink);
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: 10px;
	padding: 10px 12px;
}
textarea.answer { font-family: var(--mono); font-size: .9rem; min-height: 92px; tab-size: 4; }
textarea.editor
{
	min-height: 300px;
	font-size: .88rem;
	line-height: 1.55;
	tab-size: 4;
	-moz-tab-size: 4;
	white-space: pre;
	overflow-wrap: normal;
	overflow-x: auto;
	background: var(--code-bg);
	color: var(--code-ink);
	resize: vertical;
}
@media (max-width: 640px) { textarea.editor, textarea.answer, input[type="text"], input[type="password"], input[type="number"], input[type="search"], select { font-size: 16px; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.rules { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rule { font-size: .8rem; padding: 4px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }

/* ----- Retours ----- */
.feedback { margin-top: 12px; border-radius: 10px; padding: 12px 14px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.feedback.ko { background: var(--ko-soft); border: 1px solid var(--ko); }
.feedback.info { background: var(--surface-2); border: 1px solid var(--line); }
.feedback h3 { margin-bottom: 4px; }
.feedback pre.code { background: var(--surface); }
.out { min-height: 2.6em; }
.err { color: var(--ko); font-weight: 600; }
.diffline { font-family: var(--mono); font-size: .86rem; white-space: pre-wrap; word-break: break-all; }
.vs { color: var(--muted); }
table.trace { border-collapse: collapse; margin: 8px 0; font-family: var(--mono); font-size: .86rem; }
table.trace th, table.trace td { border: 1px solid var(--line); padding: 4px 10px; text-align: center; }
table.trace th { background: var(--surface-2); }
.tablewrap { overflow-x: auto; max-width: 100%; }
details.given { margin: 10px 0; }
details.given summary { cursor: pointer; font-weight: 600; padding: 6px 0; }

/* ----- Schéma mémoire ----- */
.mem { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
@media (max-width: 640px) { .mem { grid-template-columns: 1fr; } }
.memclass { margin-top: 10px; }
.memclass h3, .mem h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.frame, .obj { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; background: var(--code-bg); }
.frame .fname, .obj .oname { font: 600 .82rem var(--mono); color: var(--muted); margin-bottom: 6px; }
.mrow { display: grid; grid-template-columns: minmax(60px, auto) 1fr; gap: 8px; align-items: center; margin: 4px 0; font-family: var(--mono); font-size: .88rem; }
.mval { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); min-height: 32px; display: flex; align-items: center; }
.mrow input, .mrow select { padding: 4px 8px; font-family: var(--mono); font-size: .88rem; border-radius: 6px; }
.mrow .good { border-color: var(--ok); background: var(--ok-soft); }
.mrow .bad { border-color: var(--ko); background: var(--ko-soft); }

/* ----- Fenêtre modale ----- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 6, 2, .5); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { max-width: 440px; width: 100%; background: var(--surface); border-radius: 16px; padding: 22px; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); text-align: center; }
.modal .big { font-size: 2.6rem; line-height: 1; margin-bottom: 8px; }
.badge-list { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }

footer.foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ==========================================================================
   Appli : onglets, chemin de leçons, lecteur de leçon, pratique, profil
   ========================================================================== */
main { max-width: 640px; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.ring
{
	--p: 0;
	position: relative;
	display: inline-grid;
	place-items: center;
	width: 36px;
	height: 36px;
	border-radius: 50%;
	background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--surface-2) 0);
	font-size: .9rem;
}
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
.ring > span { position: relative; }
@media (max-width: 380px) { .brand-name { display: none; } }

.tabbar
{
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 10;
	display: flex;
	justify-content: center;
	gap: 4px;
	padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
	background: color-mix(in srgb, var(--surface) 94%, transparent);
	backdrop-filter: blur(8px);
	border-top: 1px solid var(--line);
}
.tabbar button
{
	flex: 1;
	max-width: 160px;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 2px;
	min-height: 52px;
	padding: 6px 4px;
	border: 0;
	border-radius: 12px;
	background: none;
	color: var(--muted);
	font: 600 .76rem/1.1 var(--sans);
	cursor: pointer;
}
.tabbar .ti { font-size: 1.3rem; filter: grayscale(1); opacity: .75; }
.tabbar button.on { color: var(--accent); background: var(--accent-soft); }
.tabbar button.on .ti { filter: none; opacity: 1; }
body.in-lesson .top, body.in-lesson .tabbar { display: none; }
body.in-lesson main { padding-top: 0; }

.chip
{
	font: 600 .9rem/1 var(--sans);
	padding: 9px 14px;
	min-height: 40px;
	border-radius: 999px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	cursor: pointer;
}
.hero-card { background: var(--accent-soft); border-color: transparent; }

<script>
/* ==========================================================================
   Mini-interpréteur Java (sous-ensemble du semestre 1)
   --------------------------------------------------------------------------
   Il exécute dans le navigateur le Java des TP : types de base, tableaux 1D
   et 2D, if / switch / while / do / for, méthodes static, classes avec
   attributs private, constructeurs, this, toString, membres static.
   La saisie se fait avec Clavier.lire_xxx(), alimentée par les saisies
   prévues dans l'exercice. Chaque saisie est recopiée dans la sortie, comme
   dans un terminal, pour que la trace ressemble à celle des sujets.

   API :
     JavaMini.run(source, { inputs: [...], maxSteps, seed, fileName })
        -> { out: "texte affiché", error: null | { kind, msg, line, hint } }
     JavaMini.check(source, regles) -> [ messages d'erreur ]
   ========================================================================== */
var JavaMini = (function ()
{
	"use strict";

	/* ---------- Erreurs ----------
	   kind : "compile" (le programme ne compilerait pas avec javac),
	          "runtime" (exception levée pendant l'exécution),
	          "input"   (le test ne prévoit pas assez de saisies),
	          "limit"   (boucle infinie probable)                         */
	function JErr(kind, msg, line, hint)
	{
		var e = new Error(msg);
		e.isJava = true;
		e.kind = kind;
		e.jline = line || 0;
		e.hint = hint || "";
		return e;
	}
	function cErr(msg, line, hint) { return JErr("compile", msg, line, hint); }
	function rErr(exc, line, hint)
	{
		var e = JErr("runtime", 'Exception in thread "main" ' + exc, line, hint);
		var m = /^([\w.$]+)(?::\s?([\s\S]*))?$/.exec(exc);
		if (m) { e.excFull = m[1]; e.exc = m[1].split(".").pop(); e.excMsg = m[2] === undefined ? null : m[2]; }
		return e;
	}

	/* ======================= 1. Analyse lexicale ======================= */
	var KW = Object.create(null);
	("abstract boolean break byte case char class continue default do double else extends final " +
	 "float for if implements import int interface long new null package private protected public " +
	 "return short static switch this true false void while var instanceof super try catch finally throw throws enum").split(" ").forEach(function (k) { KW[k] = 1; });
	var PRIM = Object.assign(Object.create(null), { "int": 1, "double": 1, "char": 1, "boolean": 1, "long": 1, "short": 1, "byte": 1, "float": 1 });
	var OPS3 = [">>=", "<<=", "..."];
	var OPS2 = ["->", "++", "--", "+=", "-=", "*=", "/=", "%=", "==", "!=", "<=", ">=", "&&", "||", "&=", "|="];
	var OPS1 = "+-*/%=<>!&|^?:;,.()[]{}~@";

	function lex(src)
	{
		var toks = [], i = 0, line = 1, n = src.length;
		function push(type, v, l) { toks.push({ type: type, v: v, line: l }); }
		function escape(l)
		{
			var c = src[++i];
			var map = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", "0": "\0", "\\": "\\", "'": "'", '"': '"' };
			if (c === "u")
			{
				var hex = src.substr(i + 1, 4);
				i += 4;
				return String.fromCharCode(parseInt(hex, 16));
			}
			if (map[c] === undefined) { throw cErr("séquence d'échappement invalide : \\" + c, l); }
			return map[c];
		}
		while (i < n)
		{
			var c = src[i];
			if (c === "\n") { line++; i++; continue; }
			if (c === " " || c === "\t" || c === "\r" || c === "\f") { i++; continue; }
			if (c === "/" && src[i + 1] === "/") { while (i < n && src[i] !== "\n") { i++; } continue; }
			if (c === "/" && src[i + 1] === "*")
			{
				var startLine = line;
				i += 2;
				while (i < n && !(src[i] === "*" && src[i + 1] === "/")) { if (src[i] === "\n") { line++; } i++; }
				if (i >= n) { throw cErr("commentaire /* non fermé", startLine); }
				i += 2;
				continue;
			}
			if (/[A-Za-z_$À-ɏ]/.test(c))
			{
				var s = i;
				while (i < n && /[\w$À-ɏ]/.test(src[i])) { i++; }
				var word = src.slice(s, i);
				push(KW[word] ? "kw" : "id", word, line);
				continue;
			}
			if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || "")))
			{
				var s2 = i, isDouble = false;
				while (i < n && /[0-9_]/.test(src[i])) { i++; }
				if (src[i] === "." && /[0-9]/.test(src[i + 1] || "")) { isDouble = true; i++; while (i < n && /[0-9_]/.test(src[i])) { i++; } }
				else if (src[i] === "." && !/[A-Za-z]/.test(src[i + 1] || "")) { isDouble = true; i++; }
				if (src[i] === "e" || src[i] === "E")
				{
					isDouble = true; i++;
					if (src[i] === "+" || src[i] === "-") { i++; }
					while (i < n && /[0-9]/.test(src[i])) { i++; }
				}
				var txt = src.slice(s2, i).replace(/_/g, "");
				var suf = src[i];
				if (suf === "f" || suf === "F") { i++; push("float", Math.fround(Number(txt)), line); continue; }
				if (suf === "d" || suf === "D") { isDouble = true; i++; }
				else if (suf === "l" || suf === "L") { i++; push("long", Number(txt), line); continue; }
				if (isDouble) { push("double", Number(txt), line); }
				else
				{
					var val = Number(txt);
					if (val > 2147483647) { throw cErr("entier trop grand : " + txt + " (un int va jusqu'à 2147483647, ajoute L pour un long)", line); }
					push("int", val, line);
				}
				continue;
			}
			if (c === "'")
			{
				i++;
				var ch;
				if (src[i] === "\\") { ch = escape(line); } else if (src[i] === "'" || src[i] === "\n") { throw cErr("caractère vide '' : un char contient exactement un caractère", line); } else { ch = src[i]; }
				i++;
				if (src[i] !== "'") { throw cErr("un char s'écrit entre apostrophes et contient un seul caractère (pour du texte, utilise des guillemets \"...\")", line); }
				i++;
				push("char", ch.charCodeAt(0), line);
				continue;
			}
			if (c === '"')
			{
				i++;
				var str = "";
				while (i < n && src[i] !== '"')
				{
					if (src[i] === "\n") { throw cErr("chaîne non fermée : il manque un guillemet \"", line); }
					if (src[i] === "\\") { str += escape(line); } else { str += src[i]; }
					i++;
				}
				if (i >= n) { throw cErr("chaîne non fermée : il manque un guillemet \"", line); }
				i++;
				push("str", str, line);
				continue;
			}
			var three = src.substr(i, 3), two = src.substr(i, 2);
			if (OPS3.indexOf(three) >= 0) { push("op", three, line); i += 3; continue; }
			if (OPS2.indexOf(two) >= 0) { push("op", two, line); i += 2; continue; }
			if (OPS1.indexOf(c) >= 0) { push("op", c, line); i++; continue; }
			throw cErr("caractère inattendu : « " + c + " »", line);
		}
		toks.push({ type: "eof", v: "<fin du fichier>", line: line });
		// Pour la règle Allman : le jeton est-il le premier de sa ligne ? Quelle indentation ?
		var lines = src.split("\n");
		for (var k = 0; k < toks.length; k++)
		{
			toks[k].first = (k === 0 || toks[k - 1].line !== toks[k].line);
			var ln = lines[toks[k].line - 1] || "";
			toks[k].indent = ln.match(/^[ \t]*/)[0];
		}
		return toks;
	}

	/* ======================= 2. Analyse syntaxique ======================= */
	function normType(t)
	{
		if (t === "short" || t === "byte") { return "int"; }
		return t;
	}
	function arr(t, d) { while (d-- > 0) { t += "[]"; } return t; }

	function Parser(src)
	{
		this.toks = lex(src);
		this.p = 0;
		this.pool = Object.create(null); // chaînes littérales partagées (comme le « pool » de Java)
	}
	Parser.prototype = {
		peek: function (k) { return this.toks[Math.min(this.p + (k || 0), this.toks.length - 1)]; },
		next: function () { return this.toks[this.p++]; },
		is: function (v, k) { var t = this.peek(k); return (t.type === "op" || t.type === "kw") && t.v === v; },
		accept: function (v) { if (this.is(v)) { return this.next(); } return null; },
		prevLine: function () { return this.toks[Math.max(0, this.p - 1)].line; },
		expect: function (v, quoi)
		{
			if (this.is(v)) { return this.next(); }
			var t = this.peek();
			var line = (v === ";" || v === ")") ? this.prevLine() : t.line;
			throw cErr("« " + v + " » attendu" + (quoi ? " " + quoi : "") + ", trouvé « " + t.v + " »", line,
				v === ";" ? "Chaque instruction Java se termine par un point-virgule." : "");
		},
		ident: function (quoi)
		{
			var t = this.peek();
			if (t.type === "id") { return this.next().v; }
			if (t.type === "kw") { throw cErr("« " + t.v + " » est un mot réservé de Java, il ne peut pas servir de nom" + (quoi ? " de " + quoi : ""), t.line); }
			throw cErr("nom attendu" + (quoi ? " (" + quoi + ")" : "") + ", trouvé « " + t.v + " »", t.line);
		},
		program: function ()
		{
			var classes = [];
			classes.imports = [];
			classes.importLines = [];
			classes.toks = this.toks;
			while (this.peek().type !== "eof")
			{
				var isImport = this.is("import");
				if (this.accept("import") || this.accept("package"))
				{
					var path = "";
					while (!this.is(";") && this.peek().type !== "eof") { path += this.next().v; }
					this.expect(";");
					if (isImport) { classes.imports.push(path); classes.importLines.push(this.toks[this.p - 1].line); }
					continue;
				}
				classes.push(this.classDecl());
			}
			if (!classes.length) { throw cErr("aucune classe : un programme Java commence par public class NomDeLaClasse", 1); }
			return classes;
		},

	/* ======================= 5. Points d'entrée ======================= */
	function parse(src) { return new Parser(src).program(); }

	/* ---- Plusieurs fichiers : un seul texte, chaque fichier commence par la ligne
	   « //// Fichier : Nom.java » (un commentaire, donc du Java valide). ---- */
	var MARK = /^\/\/\/\/ Fichier : ([A-Za-z_$][\w$]*\.java)\s*$/;
	function isMulti(code) { return /^\/\/\/\/ Fichier : /.test(String(code || "").replace(/^\s+/, "")); }

	{
		var files = [], cur = null;
		String(code || "").split("\n").forEach(function (l)
		{
			var m = l.match(MARK);
			if (m) { cur = { name: m[1], lines: [] }; files.push(cur); return; }
			if (!cur) { cur = { name: null, lines: [] }; files.push(cur); }
			cur.lines.push(l);

		files = files.map(function (f) { return { name: f.name, code: f.lines.join("\n") }; });
		if (files.length > 1 && files[0].name === null && !files[0].code.trim()) { files.shift(); }
		return files;
	}
	function joinFiles(files) { return files.map(function (f) { return "//// Fichier : " + f.name + "\n" + f.code; }).join("\n"); }

	{
		if (!isMulti(src)) { return null; }
		var segs = [], lines = String(src).split("\n");
		for (var i = 0; i < lines.length; i++)

			if (m) { if (segs.length) { segs[segs.length - 1].to = i; } segs.push({ name: m[1], from: i + 2, to: lines.length }); }

		if (!segs || !line) { return null; }
		var sg = segOf(segs, line);
		return { file: sg.name, line: Math.max(1, line - sg.from + 1) };
	}

			classes.forEach(function (c) { (c.tparams || []).forEach(function (p) { TPARAMS[p] = 1; }); });

			if (segs)
			{
				/* Comme javac : une classe publique par fichier, et le fichier porte son nom. */
				classes.forEach(function (c)
				{
					var sg = segOf(segs, c.line);
					if (c.pub && sg && sg.name !== c.name + ".java")
					{
						var bon = segs.some(function (x) { return x.name === c.name + ".java"; });
						throw cErr("la classe " + c.name + " est publique, elle doit être dans un fichier nommé " + c.name + ".java (elle est écrite dans " + sg.name + ")", c.line,
							bon ? "Déplace-la dans l'onglet " + c.name + ".java, ou enlève public." : "Un fichier Java ne contient qu'une seule classe publique, et le fichier porte son nom.");
					}

	/* Comme javac : ArrayList, HashMap... ne sont connues qu'après import java.util.XXX; (ou java.util.*). */

	{

		classes.forEach(function (c) { mine[c.name] = 1; });
		(classes.toks || []).forEach(function (t, i)
		{
			var prev = classes.toks[i - 1];
			if (t.type !== "id" || !UTIL[t.v] || mine[t.v] || (prev && prev.v === ".")) { return; }

			var seg = segs ? segOf(segs, t.line) : null;
			var ok = imp.some(function (p, k) { return (p === "java.util." + t.v || p === "java.util.*") && (!seg || segOf(segs, il[k]) === seg); });
			if (!ok)

	/* Parcours générique de l'arbre syntaxique. */
	function walk(node, fn)
	{
		if (!node || typeof node !== "object") { return; }
		if (Array.isArray(node)) { node.forEach(function (x) { walk(x, fn); }); return; }
		if (node.k) { fn(node); }
		for (var key in node)
		{
			if (key === "val" || key === "cls" || key === "line") { continue; }
			var v = node[key];
			if (v && typeof v === "object") { walk(v, fn); }
		}
	}

	/* ======================= 6. Règles d'écriture (évaluations) =======================
	   regles : tableau de chaînes ou d'objets :
	     "onlyWhile"      seule la boucle while est permise (ni for, ni do)
	     "noFor"          pas de for
	     "allman"         accolades seules sur leur ligne et alignées
	     "noFormat"       pas de String.format ni de printf
	     { noCallsIn: "contenu" }   la méthode ne doit appeler aucune méthode
	     { method: { name, ret, params: [types], stat, priv } }  méthode obligatoire
	     { calls: { from: "main", name: "repeter" } }  main doit appeler repeter

						if (init) { continue; }

						else if (prev && t.indent !== prev.indent) { msgs.push("Ligne " + t.line + " : l'accolade { doit être alignée avec l'instruction de la ligne " + prev.line + "."); }
						var nx = toks[i + 1];
						if (nx && nx.line === t.line && nx.type !== "eof") { msgs.push("Ligne " + t.line + " : rien ne doit suivre l'accolade { sur la même ligne."); }
					}
					else if (t.v === "}")
					{
						var open = stack.pop();
						if (!open || open.init) { continue; }
						if (!t.first) { msgs.push("Ligne " + t.line + " : l'accolade } doit être seule sur sa ligne."); }
						else if (t.indent !== open.tok.indent) { msgs.push("Ligne " + t.line + " : l'accolade } doit être alignée avec l'accolade { de la ligne " + open.tok.line + "."); }
						var nx2 = toks[i + 1];
						if (nx2 && nx2.line === t.line && nx2.type !== "eof" && nx2.v !== ";") { msgs.push("Ligne " + t.line + " : « " + nx2.v + " » doit passer à la ligne suivante (style Allman)."); }
					}
				}
			}
			else if (name === "noCallsIn")
			{
				var target = r.noCallsIn;
				classes.forEach(function (c)
				{
					(c.methods[target] || []).forEach(function (m)
					{
						walk(m.body, function (n)
						{
							if (n.k === "call") { msgs.push("Ligne " + n.line + " : la méthode " + target + " ne doit appeler aucune autre méthode (ici : " + n.name + ")."); }
							if (n.k === "new" && n.cls !== "String") { msgs.push("Ligne " + n.line + " : la méthode " + target + " ne doit appeler aucune méthode (ici : new " + n.cls + ")."); }
						});
					});
				});
			}
			else if (name === "method")
			{
				var spec = r.method, found = null;
				classes.forEach(function (c) { (c.methods[spec.name] || []).forEach(function (m) { found = found || m; }); });
				var sig = (spec.priv ? "private " : "") + (spec.stat ? "static " : "") + spec.ret + " " + spec.name + "(" + spec.params.join(", ") + ")";
				if (!found) { msgs.push("La méthode " + sig + " est obligatoire."); }
				else
				{
					var okSig = found.ret === spec.ret && found.params.length === spec.params.length &&
						found.params.every(function (p, k) { return p.t === spec.params[k]; }) &&
						(spec.stat === undefined || found.stat === spec.stat) && (spec.priv === undefined || found.priv === spec.priv);
					if (!okSig) { msgs.push("Ligne " + found.line + " : la signature attendue est " + sig + "."); }
				}
			}
			else if (name === "calls")
			{
				var cs = r.calls, ok = false;
				classes.forEach(function (c)
				{
					(c.methods[cs.from] || []).forEach(function (m) { walk(m.body, function (n) { if (n.k === "call" && n.name === cs.name) { ok = true; } }); });
				});
				if (!ok) { msgs.push("La méthode " + cs.from + " doit appeler " + cs.name + "(...)."); }
			}
			else if (name === "once")
			{
				var nb = toks.filter(function (t) { return t.type === "id" && t.v === r.once; });
				if (nb.length > 1) { msgs.push("Il faut un seul appel à " + r.once + " (tu en as " + nb.length + ", lignes " + nb.map(function (t) { return t.line; }).join(", ") + ")."); }
			}
			else if (name === "forbid")
			{
				toks.forEach(function (t)
				{
					if ((t.type === "id" || t.type === "kw") && r.forbid.indexOf(t.v) >= 0) { msgs.push("Ligne " + t.line + " : " + t.v + " est interdit dans cet exercice" + (r.why ? " (" + r.why + ")" : "") + "."); }
				});
			}
		});
		return msgs;
	}

	/* Niveau par défaut des exécutions : 1 (S1, sans API) ou 2 (S2 : collections, interfaces...). */
	function setNiveau(n) { DEFAULTS.niveau = n || 1; }
	return { run: run, check: check, parse: parse, lex: lex, fmtDouble: fmtDouble, setNiveau: setNiveau, isMulti: isMulti, splitFiles: splitFiles, joinFiles: joinFiles, whereLine: whereLine };
})();

				solution: T(`
    static boolean estLettre(char c)
    {
        return (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z');
    }

    static boolean estVoyelle(char c)
    {
        return c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u' || c == 'y'
            || c == 'A' || c == 'E' || c == 'I' || c == 'O' || c == 'U' || c == 'Y';
    }

    static char enMajuscule(char c)
    {
        if (c >= 'a' && c <= 'z')
        {
            return (char) (c - 32);
        }
        return c;
    }

    static String bilan(String phrase)
    {
        int nbLettres = 0;
        int nbVoyelles = 0;
        int i = 0;
        while (i < phrase.length())
        {
            char c = phrase.charAt(i);
            if (estLettre(c))
            {
                nbLettres++;
                if (estVoyelle(c))
                {
                    nbVoyelles++;
                }
            }
            i++;
        }
        return nbLettres + " lettres dont " + nbVoyelles + " voyelles";
    }`) }

    static int nbBombesAutour(boolean[][] bombes, int lig, int col)
    {
        int nb = 0;
        for (int l = lig - 1; l <= lig + 1; l++)
        {
            for (int c = col - 1; c <= col + 1; c++)
            {
                boolean dedans = l >= 0 && l < bombes.length && c >= 0 && c < bombes[0].length;
                if (dedans && !(l == lig && c == col) && bombes[l][c])
                {
                    nb++;
                }
            }
        }
        return nb;
    }

    static String enChaine(boolean[][] bombes)
    {
        String s = "";
        for (int lig = 0; lig < bombes.length; lig++)
        {
            for (int col = 0; col < bombes[0].length; col++)
            {
                int nb = nbBombesAutour(bombes, lig, col);
                if (bombes[lig][col])
                {
                    s = s + "*";
                }
                else if (nb == 0)
                {
                    s = s + ".";
                }
                else
                {
                    s = s + nb;
                }
            }

        }

    static char tourner(char dir, char sens)

        {
            switch (dir)
            {

                case 'E':
                    nouv = 'S';

import iut.algo.Clavier;

public class Pascal
{
    public static void main(String[] args)
    {
        int n;
        int[][] tri;
        String ligne;

        System.out.print("Rang : ");
        n = Clavier.lire_int();
        tri = new int[n][n];

        for (int l = 0; l < n; l++)
        {
            tri[l][0] = 1;
            tri[l][l] = 1;
            for (int c = 1; c < l; c++)
            {
                tri[l][c] = tri[l - 1][c - 1] + tri[l - 1][c];
            }
        }

        for (int l = 0; l < n; l++)
        {
            ligne = "";
            for (int c = 0; c <= l; c++)
            {
                ligne = ligne + tri[l][c];
                if (c < l)
                {
                    ligne = ligne + " ";
                }
            }
            System.out.println(ligne);
        }
    }
}`) }

public class Classement
{
    static void afficher(int[] t)
    {
        for (int i = 0; i < t.length; i++)

        }
        System.out.println();
    }

    static void trier(int[] temps)
    {
        int val;
        int j;
        for (int i = 1; i < temps.length; i++)
        {
            val = temps[i];
            j = i - 1;
            while (j >= 0 && temps[j] > val)
            {
                temps[j + 1] = temps[j];
                j--;
            }
            temps[j + 1] = val;
        }
    }

import iut.algo.Clavier;

{
    static int chercher(int[] num, int val)
    {
        int min = 0;
        int max = num.length - 1;
        int milieu;
        int res = -1;
        while (min <= max && res == -1)

            milieu = (min + max) / 2;
            if (num[milieu] == val)

                res = milieu;
            }
            else if (num[milieu] < val)

                min = milieu + 1;
            }

            {
                max = milieu - 1;
            }
        }
        return res;
    }

import iut.algo.Clavier;

public class Casier
{
    static int chercher(int[] num, int val)
    {
        int min = 0;
        int max = num.length - 1;
        int milieu;
        int res = -1;
        while (min <= max && res == -1)
        {
            milieu = (min + max) / 2;
            if (num[milieu] == val)
            {
                res = milieu;
            }
            else if (num[milieu] < val)
            {
                min = milieu + 1;
            }
            else
            {
                max = milieu - 1;
            }
        }
        return res;
    }

    static int nbTours(int[] num, int val)
    {
        int min = 0;
        int max = num.length - 1;
        int milieu;
        int tours = 0;
        boolean trouve = false;
        while (min <= max && !trouve)
        {
            tours++;
            milieu = (min + max) / 2;
            if (num[milieu] == val)
            {
                trouve = true;
            }
            else if (num[milieu] < val)
            {
                min = milieu + 1;
            }
            else
            {
                max = milieu - 1;
            }
        }
        return tours;
    }

    public static void main(String[] args)
    {
        int[] num = { 1203, 1580, 2214, 3007, 4410, 5121, 6033, 7450, 8090 };
        int val;
        int ind;

        System.out.print("Numéro du livre : ");
        val = Clavier.lire_int();
        ind = chercher(num, val);
        if (ind == -1)
        {
            System.out.println("Livre absent");
        }
        else
        {
            System.out.println("Casier " + ind);
        }
        System.out.println("Dichotomie : " + nbTours(num, val) + " tours");
        if (ind == -1)

        }

        {

public class Prix
{
    static void augmenter(int prix)
    {
        prix = prix + 10;
        System.out.println("Dans la méthode : " + prix);
    }

    static int augmente(int prix)
    {
        return prix + 10;
    }

    static void augmenterTous(int[] prix)
    {
        for (int i = 0; i < prix.length; i++)
        {
            prix[i] = prix[i] + 10;
        }
    }

    public static void main(String[] args)
    {
        int prix = 50;
        int[] tarifs = { 5, 12, 30 };

        System.out.println("Avant : " + prix);
        augmenter(prix);
        System.out.println("Après : " + prix);

        prix = augmente(prix);
        System.out.println("Avec return : " + prix);

        augmenterTous(tarifs);

public class Releve
{
    static int premierNegatif(int[] t)
    {
        int i = 0;
        while (i < t.length && t[i] >= 0)
        {
            i++;
        }
        if (i == t.length)
        {
            i = -1;
        }
        return i;
    }

    static int sommePositifs(int[] t)
    {
        int somme = 0;
        for (int i = 0; i < t.length; i++)
        {
            if (t[i] > 0)
            {
                somme += t[i];
            }
        }
        return somme;
    }

    public static void main(String[] args)
    {
        int[] temp = { 4, 2, 0, -3, 1, -5 };
        int[] doux = { 8, 11, 9 };

        System.out.println("temp : premier négatif " + premierNegatif(temp) + ", somme des positifs " + sommePositifs(temp));
        System.out.println("doux : premier négatif " + premierNegatif(doux) + ", somme des positifs " + sommePositifs(doux));
    }
}`) }

			regles: ["allman"],
			harness: T(`

{

    {
        Parking p = new Parking(4);
        System.out.println("garer(2) : " + p.garer(2));
        System.out.println("garer(2) : " + p.garer(2));
        System.out.println("garer(7) : " + p.garer(7));

        System.out.println("garer() : " + p.garer());

        System.out.println("liberer(1) : " + p.liberer(1));

        System.out.println(p);
    }

			depart: T(`
public class Parking
{

}`),
			solution: T(`
public class Parking
{
    private boolean[] places;

    public Parking(int nbPlaces)
    {
        this.places = new boolean[nbPlaces];
    }

    public int garer(int place)
    {
        if (place < 0 || place >= this.places.length)
        {
            return -1;
        }
        if (this.places[place])
        {
            return -2;
        }
        this.places[place] = true;
        return 0;
    }

    public int garer()
    {
        for (int i = 0; i < this.places.length; i++)
        {
            if (!this.places[i])
            {
                this.places[i] = true;
                return i;
            }
        }
        return -3;
    }

    public int liberer(int place)
    {
        if (place < 0 || place >= this.places.length)
        {
            return -1;
        }
        if (!this.places[place])
        {
            return -4;
        }
        this.places[place] = false;
        return 0;
    }

    public String toString()
    {
        String s = "[";
        for (int i = 0; i < this.places.length; i++)
        {
            if (this.places[i])
            {
                s = s + "X";
            }
            else
            {
                s = s + ".";
            }
        }
        return s + "]";
    }
}`) },

			regles: ["allman"],
			harness: T(`

{
    public static void main(String[] args)
    {

        for (int fin = t.length - 1; fin > 0; fin--)
        {
            for (int i = 0; i < fin; i++)
            {
                if (t[i].compareTo(t[i + 1]) > 0)
                {
                    Coureur tmp = t[i];
                    t[i] = t[i + 1];
                    t[i + 1] = tmp;
                }
            }
        }
        for (int i = 0; i < 3; i++)
        {
            System.out.println((i + 1) + ". " + t[i]);
        }
        System.out.println("Dernier : " + t[3]);
    }
}`),
			depart: T(`
public class Coureur
{

}`),
			solution: T(`
public class Coureur
{
    private String nom;
    private int temps;

    public Coureur(String nom, int temps)
    {
        this.nom = nom;
        this.temps = temps;
    }

    public int compareTo(Coureur c)
    {
        return this.temps - c.temps;
    }

    public String toString()
    {
        int sec = this.temps % 60;
        String s = "" + sec;
        if (sec < 10)
        {
            s = "0" + s;
        }
        return this.nom + " : " + this.temps / 60 + " min " + s + " s";
    }
}`) }

public class Vehicule
{
    private static int nbVehicules = 0;   // un seul pour toute la classe

    private boolean moteurEnMarche;          // un par objet
    private int     nbKm;                    // un par objet

    public Vehicule()
    {
        this.moteurEnMarche = false;
        this.nbKm           = 0;
        Vehicule.nbVehicules++;
    }

    public void contact()
    {
        this.moteurEnMarche = !this.moteurEnMarche;
    }

    public void avancer()
    {
        if (this.moteurEnMarche)
        {
            this.nbKm++;
        }
    }

    public static int getNbVehicules()
    {
        return Vehicule.nbVehicules;
    }

    public String toString()

    }
}`),

import java.util.ArrayList;

public class Panier
{
    private ArrayList<Double> prix;

    public Panier()
    {
        this.prix = new ArrayList<Double>();
    }

    public void ajouter(double p)
    {
        this.prix.add(p);
    }

    public int getNbArticles()
    {
        return this.prix.size();
    }

    public double total()
    {
        double somme = 0;
        for (double p : this.prix)
        {
            somme = somme + p;
        }
        return somme;
    }

    public double plusCher()
    {
        double max = 0;
        for (double p : this.prix)
        {
            if (p > max)
            {
                max = p;
            }
        }
        return max;
    }
}`),

public class Region
{
    private String        nom;
    private Departement[] tabDept;
    private int           nbDept;

    public Region(String nom, int nbDeptTotal)
    {
        this.nom     = nom;
        this.tabDept = new Departement[nbDeptTotal];
        this.nbDept  = 0;
    }

    public boolean ajouterDepartement(Departement d)
    {
        if (d == null || this.nbDept == this.tabDept.length)
        {
            return false;
        }
        this.tabDept[this.nbDept] = d;
        this.nbDept++;
        return true;
    }

    public int getNbDept()
    {
        return this.nbDept;
    }

    public int getPopulation()
    {
        int total = 0;
        for (int cpt = 0; cpt < this.nbDept; cpt++)
        {
            total += this.tabDept[cpt].getPopulation();
        }
        return total;
    }

    public int getSuperficie()
    {
        int total = 0;
        for (int cpt = 0; cpt < this.nbDept; cpt++)
        {
            total += this.tabDept[cpt].getSuperficie();
        }
        return total;
    }

    public double densite()
    {
        return (double) this.getPopulation() / this.getSuperficie();
    }

public class Plateau
{
    private Piece[][] tabPiece;

    public Plateau()
    {
        this.tabPiece = new Piece[4][4];
    }

    public boolean poser(int lig, int col, Piece p)
    {
        if (lig < 0 || lig >= this.tabPiece.length || col < 0 || col >= this.tabPiece[0].length)
        {
            return false;
        }
        if (this.tabPiece[lig][col] != null)
        {
            return false;
        }
        this.tabPiece[lig][col] = p;
        return true;
    }

    public boolean estPlein()
    {
        for (int lig = 0; lig < this.tabPiece.length; lig++)
        {
            for (int col = 0; col < this.tabPiece[lig].length; col++)
            {
                if (this.tabPiece[lig][col] == null)
                {
                    return false;
                }
            }
        }
        return true;
    }

    public boolean ligneGagnante(int lig)
    {
        for (int col = 0; col < 4; col++)
        {
            if (this.tabPiece[lig][col] == null)
            {
                return false;
            }
        }
        for (int i = 0; i < 4; i++)
        {
            char c = this.tabPiece[lig][0].getCarac(i);
            boolean commune = true;
            for (int col = 1; col < 4; col++)
            {
                if (this.tabPiece[lig][col].getCarac(i) != c)
                {
                    commune = false;
                }
            }
            if (commune)
            {
                return true;
            }
        }
        return false;
    }
}`),

public class Personne
{
    private String   nom;
    private Personne mere;
    private Personne pere;

    public Personne(String nom)
    {
        this.nom  = nom;
        this.mere = null;
        this.pere = null;
    }

    public void setParents(Personne mere, Personne pere)
    {
        this.mere = mere;
        this.pere = pere;
    }

    public boolean estParent(Personne p)
    {
        return p != null && (p.mere == this || p.pere == this);
    }

    public boolean estAdelphe(Personne p)
    {
        if (p == null || p == this || this.mere == null || this.pere == null)
        {

    }

import java.util.ArrayList;
import java.util.List;

public class Promo
{
    private List<Etudiant> lst;

    public Promo()
    {
        this.lst = new ArrayList<Etudiant>();
    }

    public void ajouter(Etudiant e)
    {
        this.lst.add(e);
    }

    public double moyenneGenerale()
    {
        if (this.lst.isEmpty())
        {
            return 0;
        }
        double somme = 0;
        for (Etudiant e : this.lst)
        {
            somme += e.getMoyenne();
        }
        return somme / this.lst.size();
    }

    public Etudiant meilleur()
    {
        Etudiant best = null;
        for (Etudiant e : this.lst)
        {
            if (best == null || e.getMoyenne() > best.getMoyenne())
            {
                best = e;
            }
        }
        return best;
    }

    public boolean retirer(String nom)
    {
        for (int i = 0; i < this.lst.size(); i++)
        {
            if (this.lst.get(i).getNom().equals(nom))
            {
                this.lst.remove(i);
                return true;
            }
        }
        return false;
    }
}`),

public class Train

            return false;

        this.lstVehicule.add(v);

        double total = 0;
        for (Vehicule v : this.lstVehicule)

            total += v.getChargeMaxi();
        }
        return total;
    }

    public String toString()

        {
            s += v + "\\n";
        }
        return s;
    }

public class ListeDouble
{
    private CelluleDouble tete;
    private CelluleDouble queue;

    public ListeDouble()
    {
        this.tete  = null;
        this.queue = null;
    }

    public boolean estVide()
    {
        return this.tete == null;
    }

    public void ajouter(String val)
    {
        CelluleDouble cel = new CelluleDouble(val);
        if (this.estVide())
        {
            this.tete = cel;
        }
        else
        {
            this.queue.setSvt(cel);     // l'ancienne dernière pointe vers la nouvelle
            cel.setPrc(this.queue);     // et la nouvelle vers l'ancienne
        }
        this.queue = cel;
    }

        String s = "";
        for (CelluleDouble cel = this.tete; cel != null; cel = cel.getSvt())

        return s;
    }

import java.util.Comparator;

public class ListeTriee
{
    private Cellule tete;
    private Cellule queue;
    private Comparator<Etudiant> comp;

    public ListeTriee(Comparator<Etudiant> comp)
    {
        this.comp = comp;
    }

    public void ajouter(Etudiant e)
    {
        Cellule cel = new Cellule(e);
        Cellule apres = this.tete;
        while (apres != null && this.comp.compare(apres.getEtudiant(), e) <= 0)
        {
            apres = apres.getSvt();
        }
        if (apres == null)
        {
            if (this.queue == null)
            {
                this.tete = cel;
            }
            else
            {
                this.queue.setSvt(cel);
                cel.setPrc(this.queue);
            }
            this.queue = cel;
        }
        else
        {
            Cellule avant = apres.getPrc();
            cel.setSvt(apres);
            apres.setPrc(cel);
            cel.setPrc(avant);
            if (avant == null)
            {
                this.tete = cel;
            }
            else
            {
                avant.setSvt(cel);
            }
        }
    }

    public String toString()
    {
        String s = "";
        for (Cellule c = this.tete; c != null; c = c.getSvt())
        {
            if (c != this.tete)
            {
                s += " | ";
            }
            s += c.getEtudiant();
        }
        return s;
    }

    public String inverse()
    {
        String s = "";
        for (Cellule c = this.queue; c != null; c = c.getPrc())
        {
            if (c != this.queue)
            {
                s += " | ";
            }
            s += c.getEtudiant();
        }
        return s;
    }
}`),

public class Adherent
{
    public static final int MAX_EMPRUNTS = 3;

    private static int nbAdherents   = 0;
    private static int totalEmprunts = 0;

    private String nom;
    private int    nbEmprunts;

    public Adherent(String nom)
    {
        Adherent.nbAdherents++;
        this.numero     = Adherent.nbAdherents;
        this.nom        = nom;
        this.nbEmprunts = 0;
    }

    public static int getNbAdherents()
    {
        return Adherent.nbAdherents;
    }

    public static int getTotalEmprunts()
    {
        return Adherent.totalEmprunts;
    }

    public int getNbEmprunts()
    {
        return this.nbEmprunts;
    }

    public boolean emprunter()
    {
        if (this.nbEmprunts == Adherent.MAX_EMPRUNTS)
        {
            return false;
        }
        this.nbEmprunts++;
        Adherent.totalEmprunts++;
        return true;
    }

    public void rendre()
    {
        if (this.nbEmprunts > 0)
        {
            this.nbEmprunts--;
            Adherent.totalEmprunts--;
        }
    }

    public String toString()
    {
        return "A" + String.format("%03d", this.numero) + " " + this.nom;
    }

public class Parking
{
    private Voiture[] places;

    public Parking(int nbPlaces)
    {
        this.places = new Voiture[nbPlaces];
    }

    public int garer(Voiture v)
    {
        if (v == null)
        {
            return -1;
        }
        for (int i = 0; i < this.places.length; i++)
        {
            if (this.places[i] == null)
            {
                this.places[i] = v;
                return i;
            }
        }
        return -1;
    }

    public int getNbLibres()
    {
        int nb = 0;
        for (int i = 0; i < this.places.length; i++)
        {
            if (this.places[i] == null)
            {
                nb++;
            }
        }
        return nb;
    }

public class Membre

    private String            pseudo;
    private ArrayList<Membre> amis;

        this.amis   = new ArrayList<Membre>();

    public boolean ajouterAmi(Membre m)
    {
        if (m == null || m == this || this.amis.contains(m))
        {
            return false;
        }
        this.amis.add(m);
        m.amis.add(this);
        return true;
    }

    public boolean estAmi(Membre m)
    {
        return this.amis.contains(m);
    }

    public int getNbAmis()
    {
        return this.amis.size();
    }

    public int nbAmisCommuns(Membre m)

        {
            if (m.amis.contains(a))

                nb++;

        }
        return nb;

                if (b != this && !this.amis.contains(b) && !res.contains(b))

import java.util.ArrayList;

interface Vendable
{
    double getPrix();
    String getNom();
}

interface Soldable
{
    void solder(int pourcent);
}

class Livre implements Vendable
{
    private String titre;
    private double prix;

    public Livre(String titre, double prix)
    {
        this.titre = titre;
        this.prix  = prix;
    }

    public double getPrix()
    {
        return this.prix;
    }

    public String getNom()
    {
        return this.titre;
    }
}

class Jeu implements Vendable, Soldable
{
    private String nom;
    private double prix;
    private int    ageMin;

    public Jeu(String nom, double prix, int ageMin)
    {
        this.nom    = nom;
        this.prix   = prix;
        this.ageMin = ageMin;
    }

    public double getPrix()
    {
        return this.prix;
    }

    public String getNom()
    {
        return this.nom;
    }

    public void solder(int pourcent)
    {
        this.prix = this.prix * (100 - pourcent) / 100;
    }
}

public class Panier
{
    private ArrayList<Vendable> articles;

    public Panier()
    {
        this.articles = new ArrayList<Vendable>();
    }

    public void ajouter(Vendable v)
    {
        this.articles.add(v);
    }

    public double total()
    {
        double t = 0;
        for (Vendable v : this.articles)
        {
            t += v.getPrix();
        }
        return t;
    }

    public int solderTout(int pourcent)
    {
        int nb = 0;
        for (Vendable v : this.articles)
        {
            if (v instanceof Soldable)
            {
                ((Soldable) v).solder(pourcent);
                nb++;
            }
        }
        return nb;
    }

    public String toString()
    {
        String s = "";
        for (Vendable v : this.articles)
        {
            s += v.getNom() + " : " + v.getPrix() + "\\n";
        }
        return s;
    }
}`),

import java.util.LinkedList;

public class FileImpression
{
    private LinkedList<Document> file;

    public FileImpression()
    {
        this.file = new LinkedList<Document>();
    }

    public void envoyer(Document d)
    {
        this.file.addLast(d);
    }

    public void envoyerUrgent(Document d)
    {
        this.file.addFirst(d);
    }

    public String imprimer()
    {
        if (this.file.isEmpty())
        {
            return null;
        }
        return this.file.removeFirst().getNom();
    }

    public int getNbDocuments()
    {
        return this.file.size();
    }

    public int pagesEnAttente()
    {
        int total = 0;
        for (Document d : this.file)
        {
            total += d.getNbPages();
        }
        return total;
    }

    public int annuler(String nom)
    {
        int nb = 0;
        for (int i = this.file.size() - 1; i >= 0; i--)
        {
            if (this.file.get(i).getNom().equals(nom))
            {
                this.file.remove(i);
                nb++;
            }
        }
        return nb;
    }

    public String toString()
    {
        return this.file.toString();
    }
}`),

public class Historique

    private Page courante;

    public void visiter(String url)

            this.courante.setSvt(p);
            p.setPrc(this.courante);

        this.courante = p;
    }

    public boolean reculer()
    {
        if (this.courante == null || this.courante.getPrc() == null)
        {
            return false;
        }
        this.courante = this.courante.getPrc();
        return true;
    }

    public boolean avancer()
    {
        if (this.courante == null || this.courante.getSvt() == null)
        {
            return false;
        }
        this.courante = this.courante.getSvt();
        return true;
    }

    public String getUrl()
    {
        if (this.courante == null)
        {
            return null;
        }
        return this.courante.getUrl();
    }

    private Page premiere()
    {
        Page p = this.courante;
        while (p != null && p.getPrc() != null)
        {
            p = p.getPrc();
        }
        return p;
    }

    public int taille()
    {
        int nb = 0;
        for (Page p = this.premiere(); p != null; p = p.getSvt())

            nb++;
        }
        return nb;
    }

        String s = "";
        for (Page p = this.premiere(); p != null; p = p.getSvt())

            if (!s.isEmpty())
            {
                s += " > ";

        }

public class Equipe
{
    private String   nom;
    private Joueur[] joueurs;
    private int      nbJoueurs;

    public Equipe(String nom, int max)
    {
        this.nom     = nom;
        this.joueurs = new Joueur[max];
    }

    public boolean recruter(Joueur j)
    {
        if (j == null || this.nbJoueurs == this.joueurs.length)
        {
            return false;
        }
        for (int i = 0; i < this.nbJoueurs; i++)
        {
            if (this.joueurs[i] == j)
            {
                return false;
            }
        }
        this.joueurs[this.nbJoueurs++] = j;
        return true;
    }

    public Joueur getCapitaine()
    {
        Joueur cap = null;
        for (int i = 0; i < this.nbJoueurs; i++)
        {
            if (cap == null || this.joueurs[i].getNiveau() > cap.getNiveau())
            {
                cap = this.joueurs[i];
            }
        }
        return cap;
    }

    public double niveauMoyen()
    {
        if (this.nbJoueurs == 0)
        {
            return 0;
        }
        int total = 0;
        for (int i = 0; i < this.nbJoueurs; i++)
        {
            total += this.joueurs[i].getNiveau();
        }
        return (double) total / this.nbJoueurs;
    }
}`) }

import java.util.ArrayList;
import java.util.Collections;

public class Epicerie
{
    private ArrayList<Produit> produits;

    public Epicerie()
    {
        this.produits = new ArrayList<Produit>();
    }

    public Produit premier()
    {
        return this.produits.get(0);
    }

    public void ajouter(Produit p)
    {
        this.produits.add(p);
    }

    public double valeurRayon(Rayon r)
    {
        double total = 0;
        for (Produit p : this.produits)
        {
            if (p.getRayon() == r)
            {
                total += p.getValeur();
            }
        }
        return total;
    }

    public Produit plusCher()
    {
        Produit best = null;
        for (Produit p : this.produits)
        {
            if (best == null || p.compareTo(best) > 0)
            {
                best = p;
            }
        }
        return best;
    }

    public String catalogue()
    {
        ArrayList<Produit> copie = new ArrayList<Produit>(this.produits);
        Collections.sort(copie);
        String s = "";
        for (Produit p : copie)
        {
            s += p + " " + p.getPrix() + "\\n";
        }
        return s;
    }
}`) }

public class Royaume
{
    private ArrayList<Province>   provinces;
    private ArrayList<Territoire> territoires;

    public Royaume(String[] lignesProvinces, String[] lignesTerritoires)
    {
        this.provinces   = new ArrayList<Province>();
        this.territoires = new ArrayList<Territoire>();
        this.initProvinces(lignesProvinces);
        this.initTerritoires(lignesTerritoires);
    }

    private void initProvinces(String[] lignes)
    {
        for (String ligne : lignes)
        {
            String[] champs = ligne.split(";");
            this.provinces.add(new Province(champs[0], champs[1]));
        }
    }

    private void initTerritoires(String[] lignes)
    {
        for (String ligne : lignes)
        {
            String[] champs = ligne.split(";");
            Province p = this.chercherProvince(champs[4]);
            if (p != null)
            {
                Territoire t = new Territoire(champs[0], champs[1], Integer.parseInt(champs[2]), Integer.parseInt(champs[3]), champs[4]);
                this.territoires.add(t);
                p.ajouterTerritoire(t);
            }
        }
    }

    public Province chercherProvince(String code)
    {
        for (Province p : this.provinces)
        {
            if (p.getCode().equals(code))

            }
        }
        return null;
    }

        return new ArrayList<Province>(this.provinces);
    }

        return new ArrayList<Territoire>(this.territoires);
    }

class Tuile
{
    private static char prochainId = 'A';

    private char    identifiant;
    private Tuile[] voisines;

    public Tuile()
    {
        this.identifiant = Tuile.prochainId;
        Tuile.prochainId++;
        this.voisines = new Tuile[6];
    }

    public char getIdentifiant()
    {
        return this.identifiant;
    }

    public Tuile getVoisine(int dir)
    {
        if (dir < 0 || dir > 5)
        {
            return null;
        }
        return this.voisines[dir];
    }

    public int nbVoisines()
    {
        int nb = 0;
        for (Tuile t : this.voisines)
        {
            if (t != null)
            {
                nb++;
            }
        }
        return nb;
    }

    public boolean ajouterVoisine(Tuile autre, int dir)
    {
        if (autre == null || autre == this || dir < 0 || dir > 5)
        {
            return false;
        }
        int oppose = (dir + 3) % 6;
        if (this.voisines[dir] != null || autre.voisines[oppose] != null)
        {
            return false;
        }
        this.voisines[dir]      = autre;
        autre.voisines[oppose]  = this;
        return true;
    }

    public String toString()
    {
        String s = this.identifiant + " : ";
        for (Tuile t : this.voisines)
        {
            s += (t == null) ? "." : "" + t.identifiant;
        }
        return s;
    }
}`);

/* ==========================================================================
   Plusieurs fichiers, comme sur machine : dans ces projets et ces sujets de DS,
   chaque classe (ou interface, ou enum) est publique et va dans son propre
   fichier, avec les import dont elle a besoin. Le code reste écrit d'un bloc
   ci-dessus ; on le découpe ici en fichiers séparés par « //// Fichier : X.java ».
   ========================================================================== */
function enFichiers(code)
{
	if (!code) { return code; }
	var imports = [], chunks = [], pending = [], cur = null;
	code.split("\n").forEach(function (l)
	{
		if (cur) { cur.lines.push(l); if (l === "}") { cur = null; } return; }
		if (/^import\s/.test(l)) { imports.push(l.trim()); return; }
		var m = l.match(/^(public\s+)?((?:abstract\s+|final\s+)*)(class|interface|enum)\s+(\w+)/);
		if (m)
		{
			while (pending.length && !pending[0].trim()) { pending.shift(); }
			cur = { name: m[4], lines: pending.concat([m[1] ? l : "public " + l]) };
			chunks.push(cur);
			pending = [];
			if (/\}\s*$/.test(l)) { cur = null; }
			return;
		}
		pending.push(l);
	});
	var used = {};
	var files = chunks.map(function (c)
	{
		var body = c.lines.join("\n").replace(/\s+$/, "");
		var imp = imports.filter(function (i)
		{
			var n = i.replace(/^import\s+|\s*;$/g, "").split(".").pop();
			var ok = n === "*" ? /\b(ArrayList|LinkedList|HashMap|List|Map|Set|Collections|Iterator|Comparator|Collection)\b/.test(body) : new RegExp("\\b" + n + "\\b").test(body);
			if (ok) { used[i] = true; }
			return ok;
		});
		return { name: c.name + ".java", imp: imp, body: body };
	});
	/* Un import que personne n'utilise encore (code de départ vide) va dans le fichier de la classe publique d'origine, sinon le dernier. */
	var reste = imports.filter(function (i) { return !used[i]; });
	if (reste.length && files.length)
	{
		var pub = code.match(/^public\s+(?:abstract\s+|final\s+)*(?:class|interface|enum)\s+(\w+)/m);
		var cible = files.filter(function (f) { return pub && f.name === pub[1] + ".java"; })[0] || files[files.length - 1];
		cible.imp = cible.imp.concat(reste);
	}
	return files.map(function (f) { return "//// Fichier : " + f.name + "\n" + (f.imp.length ? f.imp.join("\n") + "\n\n" : "") + f.body + "\n"; }).join("");
}
(function ()
{
	function conv(e)
	{
		e.solution = enFichiers(e.solution);
		if (e.depart) { e.depart = enFichiers(e.depart); }
		delete e.fichier;
		/* Le programme de test devient lui aussi un fichier : il lui faut ses propres import. */
		if (e.harness && !/^import\s/m.test(e.harness))
		{
			var imp = [];
			["ArrayList", "LinkedList", "HashMap", "List", "Map", "Collections"].forEach(function (n) { if (new RegExp("\\b" + n + "\\b").test(e.harness)) { imp.push("import java.util." + n + ";"); } });
			if (imp.length) { e.harness = imp.join("\n") + "\n\n" + e.harness; }
		}
		/* Fichier qui apparaît à une étape : on donne juste sa déclaration (sans extends ni implements). */
		var dep = e.depart || "";
		e.nouveaux = [];
		e.solution.replace(/^public\s+((?:abstract\s+|final\s+)*)(class|interface|enum)\s+(\w+)/gm, function (all, mods, kind, nom)
		{
			if (dep.indexOf("//// Fichier : " + nom + ".java\n") < 0) { e.nouveaux.push({ name: nom + ".java", code: "public " + mods + kind + " " + nom + "\n{\n\n}\n" }); }
			return all;
		});
	}
	["o07", "o09", "o10"].forEach(function (id) { OBJETS_PROJETS[id].etapes.forEach(conv); });
	OBJETS_EVALS.filter(function (v) { return v.id === "oevA" || v.id === "oevB"; }).forEach(function (v)
	{
		v.etapes.forEach(conv);
		v.intro = v.intro.replace(/Tout se passe dans (le fichier )?`\w+\.java`\./, "Chaque classe est publique et a son propre fichier (un onglet chacun), comme sur machine.");
	});
	function txt(id, from, to)
	{
		var all = [];
		["o07", "o09", "o10"].forEach(function (k) { all = all.concat(OBJETS_PROJETS[k].etapes); });
		OBJETS_EVALS.forEach(function (v) { all = all.concat(v.etapes); });
		var e = all.filter(function (x) { return x.id === id; })[0];
		e.enonce = e.enonce.replace(from, to);
		if (e.indices) { e.indices = e.indices.map(function (s) { return s.replace(from, to); }); }
	}
	txt("oevA.1", " Aucune de ces classes n'est `public`.", " Chaque classe est `public`, dans son fichier.");
	txt("oevB.1", "la classe `Tuile` (pas `public`)", "la classe `Tuile` (dans `Tuile.java`)");
	txt("o09.p2", "en haut du fichier.", "en haut de `Zoo.java` (chaque fichier a ses propres import).");
	txt("oevA.2", "pour le type de retour.", "en haut de `Royaume.java`, pour le type de retour.");
})();

import java.util.ArrayList;

interface IPioche
{
    String  piocher();

interface IDefausse

    void   defausser(String carte);
    String sommet();

public class Paquet implements IPioche, IDefausse
{
    private ArrayList<String> cartes;

    public Paquet()
    {
        this.cartes = new ArrayList<String>();
    }

    public void ajouter(String carte)
    {
        this.cartes.add(carte);
    }

    public String piocher()
    {
        if (this.cartes.isEmpty())
        {
            return null;
        }
        return this.cartes.remove(this.cartes.size() - 1);
    }

    public boolean estVide()
    {
        return this.cartes.isEmpty();
    }

    public void defausser(String carte)
    {
        this.cartes.add(carte);
    }

    public String sommet()
    {
        if (this.cartes.isEmpty())
        {
            return null;
        }
        return this.cartes.get(this.cartes.size() - 1);
    }
}`),

class Maillon<T>
{
    private T valeur;
    private Maillon<T> svt;

    public Maillon(T valeur)
    {
        this.valeur = valeur;
        this.svt = null;
    }

    public T getValeur()
    {
        return this.valeur;
    }

    public Maillon<T> getSvt()
    {
        return this.svt;
    }

    public void setSvt(Maillon<T> svt)
    {
        this.svt = svt;
    }
}

public class FileAttente<T>
{
    private Maillon<T> tete;
    private Maillon<T> queue;
    private int nb;

    public void enfiler(T v)
    {
        Maillon<T> m = new Maillon<T>(v);
        if (this.queue == null)
        {
            this.tete = m;
        }
        else
        {
            this.queue.setSvt(m);
        }
        this.queue = m;
        this.nb++;
    }

    public T defiler()
    {
        if (this.tete == null)
        {
            return null;
        }
        T v = this.tete.getValeur();
        this.tete = this.tete.getSvt();
        if (this.tete == null)
        {
            this.queue = null;
        }
        this.nb--;
        return v;
    }

    public boolean estVide()
    {
        return this.tete == null;
    }

    public int taille()
    {
        return this.nb;
    }

    public String toString()
    {
        String s = "[";
        for (Maillon<T> m = this.tete; m != null; m = m.getSvt())
        {
            s += m.getValeur();
            if (m.getSvt() != null)
            {
                s += ", ";
            }
        }
        return s + "]";
    }
}`),

function adminRecherche()
{
	var inp = h("input", { type: "search", id: "admSearch", placeholder: "id ou mot de l'énoncé (ex. : c08, tableau, equals)", autocomplete: "off", spellcheck: "false" });
	var res = h("div");
	function texte(e) { return [e.id, e.q, e.enonce, e.code, e.titre].filter(Boolean).join(" ").toLowerCase(); }
	function chercher()
	{
		clear(res);
		var q = inp.value.trim().toLowerCase();
		if (q.length < 2) { return; }
		var trouves = Object.keys(EX).filter(function (id) { return EX[id].langue === lang() && texte(EX[id].ex).indexOf(q) >= 0; });
		res.appendChild(h("p", { "class": "small muted", text: trouves.length + " résultat" + (trouves.length > 1 ? "s" : "") + (trouves.length > 30 ? " (30 premiers affichés)" : "") }));
		trouves.slice(0, 30).forEach(function (id)
		{
			var r = EX[id];
			res.appendChild(adminExRow(r.ex, r.chap ? "unité " + r.chap.num : r.controle ? r.controle.titre : r.evaluation ? "bonus" : ""));
		});
	}
	inp.addEventListener("input", chercher);
	app.appendChild(h("section", { "class": "card" }, h("h2", { text: "Rechercher un exercice" }),
		h("label", { "class": "fld sr", "for": "admSearch", text: "Rechercher" }), inp, res));
}

/* ---------- Vérification du contenu ---------- */
function adminVerif()
{
	var out = h("div");
	function verifier()
	{
		clear(out);
		var nb = 0, pb = [];
		Object.keys(EX).forEach(function (id)
		{
			var e = EX[id].ex;
			if (EX[id].langue !== lang()) { return; }
			nb++;
			if (e.k === "qcm" && !(e.a >= 0 && e.a < e.opts.length)) { pb.push(id + " : réponse hors des options"); }
			if (e.k === "fill" && e.code.split("___").length - 1 !== e.trous.length) { pb.push(id + " : nombre de trous différent du nombre de réponses"); }
			if (e.k === "bug" && (e.ligne < 1 || e.ligne > e.code.split("\n").length)) { pb.push(id + " : ligne fautive hors du code"); }
			if (e.k === "predict")
			{
				var rp = JavaMini.run(wrapSnippet(e.code), { niveau: niveauOf(e), inputs: e.inputs || [], seed: 7 });
				if (rp.error) { pb.push(id + " : " + rp.error.msg); }
			}
			if (e.k === "code")
			{
				if (!e.solution) { pb.push(id + " : pas de solution"); return; }
				var b = buildSource(e, e.solution);
				var regles = JavaMini.check(b.ruleSrc, e.regles || []);
				if (regles.length) { pb.push(id + " : la solution viole ses règles (" + regles.join(" ; ") + ")"); }
				(e.tests || [{ "in": [] }]).forEach(function (t)
				{
					var r = JavaMini.run(b.src, runOpts(e, b, { inputs: t["in"] || [], seed: t.seed || 7, markInput: false }));
					if (r.error) { pb.push(id + " (" + (t["in"] || []).join(", ") + ") : " + r.error.msg); }
				});
			}
		});
		out.appendChild(h("p", { "class": pb.length ? "err" : "", style: "font-weight:700", text: nb + " exercices vérifiés · " + (pb.length ? pb.length + " problème(s)" : "aucun problème") }));
		if (pb.length) { out.appendChild(h("ul", { "class": "small" }, pb.map(function (p) { return h("li", { text: p }); }))); }
	}
	app.appendChild(h("section", { "class": "card" }, h("h2", { text: "Vérifier le contenu" }),
		h("p", { "class": "small muted", text: "Exécute chaque solution et chaque « prédire la sortie » avec l'interpréteur, et contrôle les réponses des QCM, des trous et des erreurs. (La comparaison avec le vrai Java se fait avec node validate.js --javac.)" }),
		h("button", { "class": "btn", text: "Lancer la vérification", on: { click: verifier } }), out));
}

		h("label", { "class": "fld", "for": "admJson", text: "Sauvegarde (export / import)" }), ta,
		h("div", { "class": "row" },

			} } })),
