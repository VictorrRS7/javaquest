<style>
/* ==========================================================================
   JavaQuest : feuille de style
   Couleurs en variables : mode clair par défaut, mode sombre automatique
   (prefers-color-scheme) ou forcé par le bouton de thème (data-theme).
   ========================================================================== */
:root
{
	--bg: #f6f3ee;
	--surface: #fffdf9;
	--surface-2: #efe9e0;
	--ink: #1f1a14;
	--muted: #6b6157;
	--line: #ddd3c5;
	--accent: #a8470b;
	--accent-ink: #ffffff;
	--accent-soft: #f6e3d3;
	--ok: #1d7a46;
	--ok-soft: #dff2e6;
	--ko: #b42330;
	--ko-soft: #fbe1e3;
	--warn: #8a5a00;
	--warn-soft: #fbefd2;
	--code-bg: #faf6f0;
	--code-ink: #2a2118;
	--tok-kw: #9a3b06;
	--tok-str: #23703a;
	--tok-num: #6a3fb5;
	--tok-com: #8a7f73;
	--tok-type: #1f5f99;
	--focus: #1f5f99;
	--shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 4px 14px rgba(60, 40, 20, .06);
	--radius: 12px;
	--mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace;
	--sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark)
{
	:root:not([data-theme="light"])
	{
		--bg: #15120f;
		--surface: #1e1a16;
		--surface-2: #29231d;
		--ink: #f2ebe2;
		--muted: #b3a798;
		--line: #3a322a;
		--accent: #f29a52;
		--accent-ink: #1b1209;
		--accent-soft: #3a2616;
		--ok: #5fd08f;
		--ok-soft: #173826;
		--ko: #ff8a93;
		--ko-soft: #42191d;
		--warn: #f1c25b;
		--warn-soft: #3b2e10;
		--code-bg: #191511;
		--code-ink: #eee5d9;
		--tok-kw: #ffab6b;
		--tok-str: #8fdc9f;
		--tok-num: #c7a6ff;
		--tok-com: #8d8172;
		--tok-type: #86c1ff;
		--focus: #86c1ff;
		--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
		color-scheme: dark;
	}
}
:root[data-theme="dark"]
{
	--bg: #15120f;
	--surface: #1e1a16;
	--surface-2: #29231d;
	--ink: #f2ebe2;
	--muted: #b3a798;
	--line: #3a322a;
	--accent: #f29a52;
	--accent-ink: #1b1209;
	--accent-soft: #3a2616;
	--ok: #5fd08f;
	--ok-soft: #173826;
	--ko: #ff8a93;
	--ko-soft: #42191d;
	--warn: #f1c25b;
	--warn-soft: #3b2e10;
	--code-bg: #191511;
	--code-ink: #eee5d9;
	--tok-kw: #ffab6b;
	--tok-str: #8fdc9f;
	--tok-num: #c7a6ff;
	--tok-com: #8d8172;
	--tok-type: #86c1ff;
	--focus: #86c1ff;
	--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
	color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body
{
	margin: 0;
	background: var(--bg);
	color: var(--ink);
	font-family: var(--sans);
	font-size: 16px;
	line-height: 1.55;
	min-height: 100vh;
	overflow-x: hidden;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ----- En-tête ----- */
.top
{
	position: sticky;
	top: 0;
	z-index: 10;
	display: flex;
	align-items: center;
	gap: 10px;
	padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
	background: color-mix(in srgb, var(--surface) 92%, transparent);
	backdrop-filter: blur(8px);
	border-bottom: 1px solid var(--line);
}
.brand
{
	font: 700 1.05rem/1 var(--sans);
	background: none;
	border: 0;
	color: var(--ink);
	padding: 8px 4px;
	cursor: pointer;
	display: flex;
	align-items: center;
	gap: 8px;
}
.brand .logo
{
	display: inline-grid;
	place-items: center;
	width: 28px;
	height: 28px;
	border-radius: 8px;
	background: var(--accent);
	color: var(--accent-ink);
	font: 700 .8rem/1 var(--mono);
}
.top .spacer { flex: 1; }
.pill
{
	display: inline-flex;
	align-items: center;
	gap: 6px;
	font-size: .85rem;
	padding: 4px 10px;
	border-radius: 999px;
	background: var(--surface-2);
	color: var(--ink);
	white-space: nowrap;
}
.iconbtn
{
	width: 40px;
	height: 40px;
	border-radius: 10px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	cursor: pointer;
	font-size: 1.05rem;
}

/* ----- Mise en page ----- */
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; outline: none; }
.card
{
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: var(--radius);
	padding: 18px;
	margin: 0 0 16px;
	box-shadow: var(--shadow);
	min-width: 0;
}
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }

/* ----- Boutons ----- */
.btn
{
	font: 600 .95rem/1.2 var(--sans);
	border-radius: 10px;
	padding: 11px 16px;
	min-height: 44px;
	border: 1px solid transparent;
	background: var(--accent);
	color: var(--accent-ink);
	cursor: pointer;
}
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; align-self: flex-start; }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: .86rem; }
.btn.danger { background: transparent; color: var(--ko); border-color: var(--ko); }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 6px 0; text-decoration: underline; }

/* ----- Accueil ----- */
.hero { padding: 6px 0 12px; }
.hero p { color: var(--muted); max-width: 60ch; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 22px; }
.chap
{
	text-align: left;
	display: flex;
	flex-direction: column;
	gap: 6px;
	padding: 14px;
	border-radius: var(--radius);
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	font: inherit;
	cursor: pointer;
	box-shadow: var(--shadow);
	min-height: 112px;
}
.chap:hover { border-color: var(--accent); }
.chap .num { font: 600 .78rem/1 var(--mono); color: var(--muted); }
.chap .ttl { font-weight: 650; }
.chap .meta { margin-top: auto; font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.chap.locked { opacity: .55; cursor: not-allowed; box-shadow: none; }
.chap.valid { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.chap.eval { background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); }
.chap.ctl { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chap.ctl .num { color: var(--accent); }
.chap.final { grid-column: 1 / -1; min-height: 96px; background: linear-gradient(120deg, var(--accent-soft), var(--surface) 60%); border-style: solid; }
.timerbar
{
	position: sticky;
	top: 64px;
	z-index: 5;
	display: flex;
	align-items: center;
	gap: 10px;
	flex-wrap: wrap;
	padding: 10px 14px;
	margin: 0 0 14px;
	border: 1px solid var(--line);
	border-radius: var(--radius);
	background: var(--surface);
	box-shadow: var(--shadow);
}
.timerbar .time { font: 700 1.35rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.timerbar.soon .time { color: var(--warn); }
.timerbar.late { border-color: var(--ko); }
.timerbar.late .time { color: var(--ko); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 0 10px; }

/* ----- Chapitre ----- */
.crumb { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.lives { font-size: 1.1rem; letter-spacing: 2px; color: var(--ko); }
.lives .lost { color: var(--line); }
.idea { background: linear-gradient(180deg, var(--accent-soft), var(--surface) 75%); }
.idea ul { margin: 0; padding-left: 1.1em; }
.idea li + li { margin-top: 4px; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side > div { min-width: 0; }
.side .lbl { font: 600 .78rem/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
@media (max-width: 640px) { .side { grid-template-columns: 1fr; } }

.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
.step
{
	min-width: 40px;
	height: 40px;
	padding: 0 8px;
	border-radius: 10px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	font: 600 .9rem var(--sans);
	cursor: pointer;
}
.step.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.step.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.step.ko { background: var(--ko-soft); border-color: var(--ko); color: var(--ko); }
.step[disabled] { opacity: .45; cursor: not-allowed; }

.kind { display: inline-block; font: 600 .74rem/1 var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 6px; margin-bottom: 10px; }
.q { font-weight: 560; }

/* ----- Code ----- */
pre, code, textarea.editor { font-family: var(--mono); }
pre.code
{
	background: var(--code-bg);
	color: var(--code-ink);
	border: 1px solid var(--line);
	border-radius: 10px;
	padding: 12px 14px;
	margin: 10px 0;
	overflow-x: auto;
	font-size: .88rem;
	line-height: 1.55;
	tab-size: 4;
	-moz-tab-size: 4;
	white-space: pre;
	max-width: 100%;
}
code.inline { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: .9em; }
.t-kw { color: var(--tok-kw); font-weight: 600; }
.t-str { color: var(--tok-str); }
.t-num { color: var(--tok-num); }
.t-com { color: var(--tok-com); font-style: italic; }
.t-type { color: var(--tok-type); }
.t-in { font-weight: 700; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* Lignes cliquables (trouver l'erreur) */
.lines { padding: 6px 0; }
.lines button
{
	display: flex;
	width: 100%;
	text-align: left;
	background: none;
	border: 0;
	border-left: 3px solid transparent;
	color: inherit;
	font: inherit;
	padding: 1px 12px 1px 0;
	cursor: pointer;
	white-space: pre;
}
.lines button:hover { background: var(--surface-2); }
.lines .ln { display: inline-block; min-width: 2.6em; padding-right: .8em; text-align: right; color: var(--muted); user-select: none; }
.lines button.sel { background: var(--ko-soft); border-left-color: var(--ko); }
.lines button.good { background: var(--ok-soft); border-left-color: var(--ok); }

/* Trous à compléter */
.hole
{
	font: inherit;
	color: var(--ink);
	background: var(--surface);
	border: 1px dashed var(--accent);
	border-radius: 5px;
	padding: 0 4px;
	min-width: 3ch;
}
.hole.good { border: 1px solid var(--ok); background: var(--ok-soft); }
.hole.bad { border: 1px solid var(--ko); background: var(--ko-soft); }

/* ----- QCM ----- */
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt
{
	text-align: left;
	font: inherit;
	padding: 12px 14px;
	min-height: 48px;
	border-radius: 10px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	cursor: pointer;
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.opt[disabled] { cursor: default; }
.opt code { font-size: .92em; }

/* ----- Champs ----- */
label.fld { display: block; font-weight: 600; font-size: .9rem; margin: 10px 0 4px; }
textarea, input[type="text"], input[type="password"], input[type="number"], input[type="search"], select
{
	font: inherit;
	width: 100%;
	color: var(--ink);
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: 10px;
	padding: 10px 12px;
}
textarea.answer { font-family: var(--mono); font-size: .9rem; min-height: 92px; tab-size: 4; }
textarea.editor
{
	min-height: 300px;
	font-size: .88rem;
	line-height: 1.55;
	tab-size: 4;
	-moz-tab-size: 4;
	white-space: pre;
	overflow-wrap: normal;
	overflow-x: auto;
	background: var(--code-bg);
	color: var(--code-ink);
	resize: vertical;
}
@media (max-width: 640px) { textarea.editor, textarea.answer, input[type="text"], input[type="password"], input[type="number"], input[type="search"], select { font-size: 16px; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.rules { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rule { font-size: .8rem; padding: 4px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }

/* ----- Retours ----- */
.feedback { margin-top: 12px; border-radius: 10px; padding: 12px 14px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.feedback.ko { background: var(--ko-soft); border: 1px solid var(--ko); }
.feedback.info { background: var(--surface-2); border: 1px solid var(--line); }
.feedback h3 { margin-bottom: 4px; }
.feedback pre.code { background: var(--surface); }
.out { min-height: 2.6em; }
.err { color: var(--ko); font-weight: 600; }
.diffline { font-family: var(--mono); font-size: .86rem; white-space: pre-wrap; word-break: break-all; }
.vs { color: var(--muted); }
table.trace { border-collapse: collapse; margin: 8px 0; font-family: var(--mono); font-size: .86rem; }
table.trace th, table.trace td { border: 1px solid var(--line); padding: 4px 10px; text-align: center; }
table.trace th { background: var(--surface-2); }
.tablewrap { overflow-x: auto; max-width: 100%; }
details.given { margin: 10px 0; }
details.given summary { cursor: pointer; font-weight: 600; padding: 6px 0; }

/* ----- Schéma mémoire ----- */
.mem { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
@media (max-width: 640px) { .mem { grid-template-columns: 1fr; } }
.mem h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.frame, .obj { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; background: var(--code-bg); }
.frame .fname, .obj .oname { font: 600 .82rem var(--mono); color: var(--muted); margin-bottom: 6px; }
.mrow { display: grid; grid-template-columns: minmax(60px, auto) 1fr; gap: 8px; align-items: center; margin: 4px 0; font-family: var(--mono); font-size: .88rem; }
.mval { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); min-height: 32px; display: flex; align-items: center; }
.mrow input, .mrow select { padding: 4px 8px; font-family: var(--mono); font-size: .88rem; border-radius: 6px; }
.mrow .good { border-color: var(--ok); background: var(--ok-soft); }
.mrow .bad { border-color: var(--ko); background: var(--ko-soft); }

/* ----- Fenêtre modale ----- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 6, 2, .5); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { max-width: 440px; width: 100%; background: var(--surface); border-radius: 16px; padding: 22px; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); text-align: center; }
.modal .big { font-size: 2.6rem; line-height: 1; margin-bottom: 8px; }
.badge-list { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }

footer.foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ==========================================================================
   Appli : onglets, chemin de leçons, lecteur de leçon, pratique, profil
   ========================================================================== */
main { max-width: 640px; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.ring
{
	--p: 0;
	position: relative;
	display: inline-grid;
	place-items: center;
	width: 36px;
	height: 36px;
	border-radius: 50%;
	background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--surface-2) 0);
	font-size: .9rem;
}
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
.ring > span { position: relative; }
@media (max-width: 380px) { .brand-name { display: none; } }

.tabbar
{
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 10;
	display: flex;
	justify-content: center;
	gap: 4px;
	padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
	background: color-mix(in srgb, var(--surface) 94%, transparent);
	backdrop-filter: blur(8px);
	border-top: 1px solid var(--line);
}
.tabbar button
{
	flex: 1;
	max-width: 160px;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 2px;
	min-height: 52px;
	padding: 6px 4px;
	border: 0;
	border-radius: 12px;
	background: none;
	color: var(--muted);
	font: 600 .76rem/1.1 var(--sans);
	cursor: pointer;
}
.tabbar .ti { font-size: 1.3rem; filter: grayscale(1); opacity: .75; }
.tabbar button.on { color: var(--accent); background: var(--accent-soft); }
.tabbar button.on .ti { filter: none; opacity: 1; }
body.in-lesson .top, body.in-lesson .tabbar { display: none; }
body.in-lesson main { padding-top: 0; }

.chip
{
	font: 600 .9rem/1 var(--sans);
	padding: 9px 14px;
	min-height: 40px;
	border-radius: 999px;
	border: 1px solid var(--line);
	background: var(--surface);
	color: var(--ink);
	cursor: pointer;
}
.hero-card { background: var(--accent-soft); border-color: transparent; }
.btn.big { width: 100%; min-height: 52px; font-size: 1.05rem; border-radius: 14px; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.big:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.big[disabled] { box-shadow: none; }
.rowcard
{
	display: flex;
	align-items: center;
	gap: 14px;
	width: 100%;
	text-align: left;
	font: inherit;
	color: var(--ink);
	cursor: pointer;
	padding: 14px 16px;
}
.rowcard:hover:not([disabled]) { border-color: var(--accent); }

<script>
/* ==========================================================================
   Mini-interpréteur Java (sous-ensemble du semestre 1)
   --------------------------------------------------------------------------
   Il exécute dans le navigateur le Java des TP : types de base, tableaux 1D
   et 2D, if / switch / while / do / for, méthodes static, classes avec
   attributs private, constructeurs, this, toString, membres static.
   La saisie se fait avec Clavier.lire_xxx(), alimentée par les saisies
   prévues dans l'exercice. Chaque saisie est recopiée dans la sortie, comme
   dans un terminal, pour que la trace ressemble à celle des sujets.

   API :
     JavaMini.run(source, { inputs: [...], maxSteps, seed, fileName })
        -> { out: "texte affiché", error: null | { kind, msg, line, hint } }
     JavaMini.check(source, regles) -> [ messages d'erreur ]
   ========================================================================== */
var JavaMini = (function ()
{
	"use strict";

	/* ---------- Erreurs ----------
	   kind : "compile" (le programme ne compilerait pas avec javac),
	          "runtime" (exception levée pendant l'exécution),
	          "input"   (le test ne prévoit pas assez de saisies),
	          "limit"   (boucle infinie probable)                         */
	function JErr(kind, msg, line, hint)
	{
		var e = new Error(msg);
		e.isJava = true;
		e.kind = kind;
		e.jline = line || 0;
		e.hint = hint || "";
		return e;
	}
	function cErr(msg, line, hint) { return JErr("compile", msg, line, hint); }
	function rErr(exc, line, hint)
	{
		return JErr("runtime", 'Exception in thread "main" ' + exc, line, hint);
	}

	/* ======================= 1. Analyse lexicale ======================= */
	var KW = Object.create(null);
	("abstract boolean break byte case char class continue default do double else extends final " +
	 "float for if implements import int interface long new null package private protected public " +
	 "return short static switch this true false void while var").split(" ").forEach(function (k) { KW[k] = 1; });
	var PRIM = Object.assign(Object.create(null), { "int": 1, "double": 1, "char": 1, "boolean": 1, "long": 1, "short": 1, "byte": 1, "float": 1 });
	var OPS3 = [">>=", "<<=", "..."];
	var OPS2 = ["->", "++", "--", "+=", "-=", "*=", "/=", "%=", "==", "!=", "<=", ">=", "&&", "||", "&=", "|="];
	var OPS1 = "+-*/%=<>!&|^?:;,.()[]{}~@";

	function lex(src)
	{
		var toks = [], i = 0, line = 1, n = src.length;
		function push(type, v, l) { toks.push({ type: type, v: v, line: l }); }
		function escape(l)
		{
			var c = src[++i];
			var map = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", "0": "\0", "\\": "\\", "'": "'", '"': '"' };
			if (c === "u")
			{
				var hex = src.substr(i + 1, 4);
				i += 4;
				return String.fromCharCode(parseInt(hex, 16));
			}
			if (map[c] === undefined) { throw cErr("séquence d'échappement invalide : \\" + c, l); }
			return map[c];
		}
		while (i < n)
		{
			var c = src[i];
			if (c === "\n") { line++; i++; continue; }
			if (c === " " || c === "\t" || c === "\r" || c === "\f") { i++; continue; }
			if (c === "/" && src[i + 1] === "/") { while (i < n && src[i] !== "\n") { i++; } continue; }
			if (c === "/" && src[i + 1] === "*")
			{
				var startLine = line;
				i += 2;
				while (i < n && !(src[i] === "*" && src[i + 1] === "/")) { if (src[i] === "\n") { line++; } i++; }
				if (i >= n) { throw cErr("commentaire /* non fermé", startLine); }
				i += 2;
				continue;
			}
			if (/[A-Za-z_$À-ɏ]/.test(c))
			{
				var s = i;
				while (i < n && /[\w$À-ɏ]/.test(src[i])) { i++; }
				var word = src.slice(s, i);
				push(KW[word] ? "kw" : "id", word, line);
				continue;
			}
			if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || "")))
			{
				var s2 = i, isDouble = false;
				while (i < n && /[0-9_]/.test(src[i])) { i++; }
				if (src[i] === "." && /[0-9]/.test(src[i + 1] || "")) { isDouble = true; i++; while (i < n && /[0-9_]/.test(src[i])) { i++; } }
				else if (src[i] === "." && !/[A-Za-z]/.test(src[i + 1] || "")) { isDouble = true; i++; }
				if (src[i] === "e" || src[i] === "E")
				{
					isDouble = true; i++;
					if (src[i] === "+" || src[i] === "-") { i++; }
					while (i < n && /[0-9]/.test(src[i])) { i++; }
				}
				var txt = src.slice(s2, i).replace(/_/g, "");
				var suf = src[i];
				if (suf === "d" || suf === "D" || suf === "f" || suf === "F") { isDouble = true; i++; }
				else if (suf === "l" || suf === "L") { i++; push("long", Number(txt), line); continue; }
				if (isDouble) { push("double", Number(txt), line); }
				else
				{
					var val = Number(txt);
					if (val > 2147483647) { throw cErr("entier trop grand : " + txt + " (un int va jusqu'à 2147483647, ajoute L pour un long)", line); }
					push("int", val, line);
				}
				continue;
			}
			if (c === "'")
			{
				i++;
				var ch;
				if (src[i] === "\\") { ch = escape(line); } else if (src[i] === "'" || src[i] === "\n") { throw cErr("caractère vide '' : un char contient exactement un caractère", line); } else { ch = src[i]; }
				i++;
				if (src[i] !== "'") { throw cErr("un char s'écrit entre apostrophes et contient un seul caractère (pour du texte, utilise des guillemets \"...\")", line); }
				i++;
				push("char", ch.charCodeAt(0), line);
				continue;
			}
			if (c === '"')
			{
				i++;
				var str = "";
				while (i < n && src[i] !== '"')
				{
					if (src[i] === "\n") { throw cErr("chaîne non fermée : il manque un guillemet \"", line); }
					if (src[i] === "\\") { str += escape(line); } else { str += src[i]; }
					i++;
				}
				if (i >= n) { throw cErr("chaîne non fermée : il manque un guillemet \"", line); }
				i++;
				push("str", str, line);
				continue;
			}
			var three = src.substr(i, 3), two = src.substr(i, 2);
			if (OPS3.indexOf(three) >= 0) { push("op", three, line); i += 3; continue; }
			if (OPS2.indexOf(two) >= 0) { push("op", two, line); i += 2; continue; }
			if (OPS1.indexOf(c) >= 0) { push("op", c, line); i++; continue; }
			throw cErr("caractère inattendu : « " + c + " »", line);
		}
		toks.push({ type: "eof", v: "<fin du fichier>", line: line });
		// Pour la règle Allman : le jeton est-il le premier de sa ligne ? Quelle indentation ?
		var lines = src.split("\n");
		for (var k = 0; k < toks.length; k++)
		{
			toks[k].first = (k === 0 || toks[k - 1].line !== toks[k].line);
			var ln = lines[toks[k].line - 1] || "";
			toks[k].indent = ln.match(/^[ \t]*/)[0];
		}
		return toks;
	}

	/* ======================= 2. Analyse syntaxique ======================= */
	function normType(t)
	{
		if (t === "short" || t === "byte") { return "int"; }
		if (t === "float") { return "double"; }
		if (t === "Integer") { return "int"; }
		if (t === "Double") { return "double"; }
		if (t === "Character") { return "char"; }
		if (t === "Boolean") { return "boolean"; }
		return t;
	}
	function arr(t, d) { while (d-- > 0) { t += "[]"; } return t; }

	function Parser(src)
	{
		this.toks = lex(src);
		this.p = 0;
		this.pool = Object.create(null); // chaînes littérales partagées (comme le « pool » de Java)
	}
	Parser.prototype = {
		peek: function (k) { return this.toks[Math.min(this.p + (k || 0), this.toks.length - 1)]; },
		next: function () { return this.toks[this.p++]; },
		is: function (v, k) { var t = this.peek(k); return (t.type === "op" || t.type === "kw") && t.v === v; },
		accept: function (v) { if (this.is(v)) { return this.next(); } return null; },
		prevLine: function () { return this.toks[Math.max(0, this.p - 1)].line; },
		expect: function (v, quoi)
		{
			if (this.is(v)) { return this.next(); }
			var t = this.peek();
			var line = (v === ";" || v === ")") ? this.prevLine() : t.line;
			throw cErr("« " + v + " » attendu" + (quoi ? " " + quoi : "") + ", trouvé « " + t.v + " »", line,
				v === ";" ? "Chaque instruction Java se termine par un point-virgule." : "");
		},
		ident: function (quoi)
		{
			var t = this.peek();
			if (t.type === "id") { return this.next().v; }
			if (t.type === "kw") { throw cErr("« " + t.v + " » est un mot réservé de Java, il ne peut pas servir de nom" + (quoi ? " de " + quoi : ""), t.line); }
			throw cErr("nom attendu" + (quoi ? " (" + quoi + ")" : "") + ", trouvé « " + t.v + " »", t.line);
		},
		program: function ()
		{
			var classes = [];
			while (this.peek().type !== "eof")
			{
				if (this.accept("import") || this.accept("package"))
				{
					while (!this.is(";") && this.peek().type !== "eof") { this.next(); }
					this.expect(";");
					continue;
				}
				classes.push(this.classDecl());
			}
			if (!classes.length) { throw cErr("aucune classe : un programme Java commence par public class NomDeLaClasse", 1); }
			return classes;
		},
		mods: function ()
		{
			var m = {};
			for (;;)
			{
				var t = this.peek();
				if (t.type === "kw" && /^(public|private|protected|static|final|abstract)$/.test(t.v)) { m[t.v] = true; this.next(); }
				else if (this.is("@")) { this.next(); this.ident(); }
				else { return m; }
			}
		},
		classDecl: function ()
		{
			var m = this.mods();
			var t = this.peek();
			if (this.is("interface")) { throw cErr("les interfaces ne sont pas au programme du semestre 1", t.line); }
			if (!this.is("class")) { throw cErr("« class » attendu, trouvé « " + t.v + " »", t.line, "Un fichier Java contient : public class Nom { ... }"); }
			this.next();
			var name = this.ident("classe");
			if (this.is("extends") || this.is("implements")) { throw cErr("l'héritage et les interfaces ne sont pas au programme du semestre 1", t.line); }
			var cls = { name: name, pub: !!m["public"], line: t.line, fields: [], methods: Object.create(null), ctors: [], statics: Object.create(null), finfo: Object.create(null) };
			this.expect("{", "après le nom de la classe");
			while (!this.is("}"))
			{
				if (this.peek().type === "eof") { throw cErr("accolade } manquante à la fin de la classe " + name, this.prevLine()); }
				this.member(cls);
			}
			this.next();
			return cls;
		},
		type: function ()
		{
			var t = this.peek();
			var base;
			if ((t.type === "kw" && (PRIM[t.v] || t.v === "void")) || t.type === "id") { base = normType(this.next().v); }
			else { throw cErr("type attendu, trouvé « " + t.v + " »", t.line); }
			var d = 0;
			while (this.is("[") && this.is("]", 1)) { this.next(); this.next(); d++; }
			return arr(base, d);
		},
		member: function (cls)
		{
			var line = this.peek().line;
			var m = this.mods();

				this.next();

			if (this.peek().type === "id" && this.is("(", 1))

				throw cErr("type de retour manquant pour la méthode " + this.peek().v + " (ou constructeur mal nommé : il doit s'appeler exactement " + cls.name + ")", line);

			var name = this.ident("attribut ou méthode");

				var meth = { name: name, ret: type, params: ps, body: b, stat: !!m["static"], priv: !!m["private"], line: line, cls: cls };

		params: function ()

			if (type === "void") { throw cErr("une variable ne peut pas être de type void", line); }

		stmt: function ()
		{
			var t = this.peek(), line = t.line, s;

			{
				this.expect("(", "après if");
				var c = this.expr();
				this.expect(")", "pour fermer la condition du if");
				var a = this.stmt();
				var b = null;
				if (this.accept("else")) { b = this.stmt(); }
				return { k: "if", c: c, a: a, b: b, line: line };
			}
			if (this.is("else")) { throw cErr("else sans if : vérifie les accolades et qu'il n'y a pas de ; après la condition du if", line); }
			if (this.accept("while"))
			{
				this.expect("(", "après while");
				var c2 = this.expr();
				this.expect(")", "pour fermer la condition du while");
				return { k: "while", c: c2, body: this.stmt(), line: line };

				this.expect(")");

			{
				this.expect("(", "après for");
				if (this.isDecl() && (this.peek(2).v === ":" || this.peek(4).v === ":"))

					var et = this.type();
					var en = this.ident("variable");
					this.expect(":");
					var ee = this.expr();

				this.expect(";", "dans for (initialisation ; condition ; incrément)");

		switchStmt: function (line)

		bin: function (lvl)

		args: function ()
		{

			if (!this.is(")")) { do { a.push(this.expr()); } while (this.accept(",")); }

		},
		primary: function ()
		{

				case "double": this.next(); return { k: "lit", val: { t: "double", v: t.v }, line: line };

			if (this.accept("new"))

			}
			if (this.accept("("))
			{
				var e = this.expr();
				this.expect(")", "pour fermer la parenthèse");
				return { k: "paren", e: e, line: line };
			}
			throw cErr("expression attendue, trouvé « " + t.v + " »", line);
		}
	};

	/* ======================= 3. Valeurs et types ======================= */
	// Une valeur Java est un objet { t: type, v: valeur JS }.
	// Les chaînes sont des « boîtes » { s: "..." } pour que == compare les références, comme en Java.

	function toIntBits(x)

		var x = v.v;

	function fmtDouble(x)

		if (isNaN(x)) { return "NaN"; }

		if (x === 0) { return (1 / x < 0) ? "-0.0" : "0.0"; }

		if (a >= 1e-3 && a < 1e7)

		var parts = e.split("e");

	{
		if (!n) { return false; }
		if (n.k === "lit") { return n.val.t !== "String" && n.val.t !== "null"; }
		if (n.k === "paren" || n.k === "cast" || n.k === "un") { return constExpr(n.e); }
		if (n.k === "bin") { return constExpr(n.l) && constExpr(n.r); }

	/* ----- Analyse « return manquant » (comme javac) -----
	   completes(s) : l'instruction peut-elle se terminer sans return ? */
	function isTrue(c) { return c && c.k === "lit" && c.val.t === "boolean" && c.val.v === true; }
	function hasBreak(s)
	{
		if (!s || typeof s !== "object") { return false; }
		if (Array.isArray(s)) { return s.some(hasBreak); }
		if (s.k === "break") { return true; }

				case "name": return this.ref(n, fr).get();
				case "this":
					if (!fr.self) { throw cErr("this n'existe pas dans une méthode static", n.line); }
					return mk(fr.self.cls.name, fr.self);
				case "field":
					var tgt = this.evTarget(n.obj, fr);
					if (tgt.t === "class")
					{
						var cn = tgt.v;
						if (cn === "Math" && n.name === "PI") { return mk("double", Math.PI); }
						if (cn === "Math" && n.name === "E") { return mk("double", Math.E); }
						if (cn === "Integer" && n.name === "MAX_VALUE") { return mk("int", 2147483647); }
						if (cn === "Integer" && n.name === "MIN_VALUE") { return mk("int", -2147483648); }
						if (cn === "Double" && n.name === "MAX_VALUE") { return mk("double", Number.MAX_VALUE); }
						if (cn === "System" && n.name === "out") { throw cErr("System.out s'utilise avec print ou println : System.out.println(...)", n.line); }
						if (!this.classes[cn]) { throw cErr("symbole introuvable : " + cn + "." + n.name, n.line); }
						return this.fieldRef(this.classes[cn], null, n.name, n.line, fr, false, true).get();
					}
					return this.ref({ k: "field", obj: { k: "lit", val: tgt, line: n.line }, name: n.name, line: n.line }, fr).get();
				case "idx": return this.ref(n, fr).get();
				case "call": return this.call(n, fr);
				case "thisCall":
					if (!fr.meth || !fr.meth.isCtor || !fr.self) { throw cErr("this(...) ne s'utilise qu'au début d'un constructeur", n.line); }
					this.construct(fr.self.cls, fr.self, this.evArgs(n.args, fr), n.line, fr);
					return VOID;
				case "new": return this.newObj(n, fr);
				case "newArr":
					var sizes = n.dims.map(function (d)
					{
						var s = self.ev(d, fr);
						if (s.t !== "int" && s.t !== "char") { throw cErr("la taille d'un tableau doit être un int, pas un " + s.t, n.line); }
						return s.v;
					});
					return this.newArray(n.base, sizes, 0, n.extra, n.line);
				case "newArrInit": return this.arrInit(n.init, n.t, fr);
				case "arrInit": throw cErr("{ ... } s'utilise seulement dans la déclaration du tableau (ou après new type[])", n.line);
				case "cast": return this.cast(this.ev(n.e, fr), n.t, n.line);
				case "cond":
					return this.cond(n.c, fr) ? this.ev(n.a, fr) : this.ev(n.b, fr);
				case "un":
					v = this.ev(n.e, fr);
					if (n.op === "!")
					{
						if (v.t !== "boolean") { throw cErr("! s'applique à un booléen, pas à un " + v.t, n.line); }
						return mk("boolean", !v.v);
					}
					if (!num(v.t)) { throw cErr(n.op + " s'applique à un nombre, pas à un " + v.t, n.line); }
					var ut = v.t === "char" ? "int" : v.t;
					if (n.op === "-") { return ut === "int" ? mk("int", (-v.v) | 0) : mk(ut, -v.v); }
					if (n.op === "~") { return mk("int", ~v.v); }
					return mk(ut, v.v);
				case "pre": case "post":
					var rf = this.ref(n.e, fr);
					var old = rf.get();
					if (!num(old.t)) { throw cErr(n.op + " s'applique à une variable numérique", n.line); }
					var nv = convNum(mk(old.t === "double" ? "double" : (old.t === "long" ? "long" : "int"), old.v + (n.op === "++" ? 1 : -1)), old.t);
					if (old.t === "int") { nv = mk("int", (old.v + (n.op === "++" ? 1 : -1)) | 0); }
					rf.set(nv);
					return n.k === "pre" ? nv : old;
				case "assign":
					var lref = this.ref(n.l, fr);
					if (lref.t === "class") { throw cErr("affectation impossible", n.line); }
					if (n.op === "=")
					{
						var rv = n.r.k === "arrInit" ? this.arrInit(n.r, lref.t, fr) : this.ev(n.r, fr);
						if (n.l.k === "name" && n.r.k === "name" && n.l.name === n.r.name) { /* x = x : inutile mais légal */ }
						r = this.conv(rv, lref.t, n.line, n.r);
						lref.set(r);
						return r;
					}
					var cur = lref.get();
					var rhs = this.ev(n.r, fr);
					var res = this.binop(n.op.slice(0, -1), cur, rhs, n.line);
					r = (lref.t === "String") ? res : this.cast(res, lref.t, n.line);
					if (lref.t !== "String" && res.t === "String") { throw cErr("types incompatibles : String ne peut pas être converti en " + lref.t, n.line); }
					lref.set(r);
					return r;
				case "bin":
					if (n.op === "&&" || n.op === "||")
					{
						var lv = this.ev(n.l, fr);
						if (lv.t !== "boolean") { throw cErr(n.op + " s'applique à des booléens, pas à un " + lv.t, n.line); }
						if (n.op === "&&" && !lv.v) { return lv; }
						if (n.op === "||" && lv.v) { return lv; }
						var rv2 = this.ev(n.r, fr);
						if (rv2.t !== "boolean") { throw cErr(n.op + " s'applique à des booléens, pas à un " + rv2.t, n.line); }
						return rv2;
					}
					return this.binop(n.op, this.ev(n.l, fr), this.ev(n.r, fr), n.line);
			}
			throw cErr("expression inconnue", n.line);
		},
		binop: function (op, a, b, line)
		{
			if (a.t === "void" || b.t === "void") { throw cErr("une méthode void ne renvoie pas de valeur utilisable dans un calcul", line); }
			if (op === "+" && (a.t === "String" || b.t === "String"))
			{
				return mkStr(this.str(a, line) + this.str(b, line));
			}
			if (op === "==" || op === "!=")
			{
				var eq;
				if (num(a.t) && num(b.t)) { eq = a.v === b.v; }
				else if (a.t === "boolean" && b.t === "boolean") { eq = a.v === b.v; }
				else if (isRef(a.t) && isRef(b.t))
				{
					if (a.t !== "null" && b.t !== "null" && a.t !== b.t) { throw cErr("types incomparables : " + a.t + " et " + b.t, line); }
					eq = a.v === b.v;
				}
				else { throw cErr("types incomparables : " + a.t + " et " + b.t, line, (a.t === "String" || b.t === "String") ? "Une chaîne ne se compare pas à un nombre ou un caractère." : ""); }
				return mk("boolean", op === "==" ? eq : !eq);
			}
			if ((op === "&" || op === "|" || op === "^") && a.t === "boolean" && b.t === "boolean")
			{
				return mk("boolean", op === "&" ? (a.v && b.v) : (op === "|" ? (a.v || b.v) : (a.v !== b.v)));
			}
			if (!num(a.t) || !num(b.t))
			{
				var hint = "";
				if (a.t === "String" || b.t === "String") { hint = "On ne compare pas des chaînes avec < ou > : utilise compareTo (et equals pour l'égalité)."; }
				if (a.t === "boolean" || b.t === "boolean") { hint = "Pour combiner des conditions, utilise && (et) ou || (ou)."; }
				throw cErr("l'opérateur " + op + " ne s'applique pas aux types " + a.t + " et " + b.t, line, hint);
			}
			var t = (a.t === "double" || b.t === "double") ? "double" : ((a.t === "long" || b.t === "long") ? "long" : "int");
			var x = a.v, y = b.v;
			switch (op)
			{
				case "<": return mk("boolean", x < y);
				case ">": return mk("boolean", x > y);
				case "<=": return mk("boolean", x <= y);
				case ">=": return mk("boolean", x >= y);
			}
			if (t === "int")
			{
				switch (op)
				{
					case "+": return mk("int", (x + y) | 0);
					case "-": return mk("int", (x - y) | 0);
					case "*": return mk("int", Math.imul(x, y));
					case "/":
						if (y === 0) { throw rErr("java.lang.ArithmeticException: / by zero", line, "Division entière par zéro."); }
						return mk("int", (x / y) | 0);
					case "%":
						if (y === 0) { throw rErr("java.lang.ArithmeticException: / by zero", line, "Modulo par zéro."); }
						return mk("int", (x % y) | 0);
					case "&": return mk("int", x & y);
					case "|": return mk("int", x | y);
					case "^": return mk("int", x ^ y);
				}
			}
			if (t === "long")
			{
				switch (op)
				{
					case "+": return mk("long", x + y);
					case "-": return mk("long", x - y);
					case "*": return mk("long", x * y);
					case "/": if (y === 0) { throw rErr("java.lang.ArithmeticException: / by zero", line); } return mk("long", Math.trunc(x / y));
					case "%": if (y === 0) { throw rErr("java.lang.ArithmeticException: / by zero", line); } return mk("long", x % y);
				}
			}
			switch (op)
			{
				case "+": return mk("double", x + y);
				case "-": return mk("double", x - y);
				case "*": return mk("double", x * y);
				case "/": return mk("double", x / y);
				case "%": return mk("double", x % y);
			}
			throw cErr("l'opérateur " + op + " ne s'applique pas à des " + t, line);
		}
	};

	/* ======================= 5. Points d'entrée ======================= */
	function parse(src) { return new Parser(src).program(); }

	function run(src, opts)
	{
		opts = opts || {};
		var m = null;
		try
		{
			var classes = parse(src);
			if (opts.fileName)
			{
				var pub = classes.filter(function (c) { return c.pub; })[0];
				if (pub && pub.name !== opts.fileName)
				{
					throw cErr("la classe " + pub.name + " est publique, elle doit être dans un fichier nommé " + pub.name + ".java (le fichier s'appelle " + opts.fileName + ".java)", pub.line);
				}
			}
			checkReturns(classes);
			m = new Machine(classes, opts);
			m.start();
			return { out: m.out.join(""), error: null, steps: m.steps };
		}
		catch (e)
		{
			if (e && e.kind === "exit") { return { out: m.out.join(""), error: null, steps: m.steps }; }
			if (!e || !e.isJava)
			{
				if (e instanceof RangeError) { e = JErr("runtime", 'Exception in thread "main" java.lang.StackOverflowError', 0, "Trop d'appels imbriqués."); }
				else { e = JErr("compile", "Erreur interne de l'interpréteur : " + (e && e.message), 0); }
			}
			return {
				out: (m && e.kind !== "compile") ? m.out.join("") : "",
				error: { kind: e.kind, msg: e.message, line: e.jline, hint: e.hint },
				steps: m ? m.steps : 0
			};
		}
	}

	/* Parcours générique de l'arbre syntaxique. */
	function walk(node, fn)
	{
		if (!node || typeof node !== "object") { return; }
		if (Array.isArray(node)) { node.forEach(function (x) { walk(x, fn); }); return; }
		if (node.k) { fn(node); }
		for (var key in node)
		{
			if (key === "val" || key === "cls" || key === "line") { continue; }
			var v = node[key];
			if (v && typeof v === "object") { walk(v, fn); }
		}
	}

	/* ======================= 6. Règles d'écriture (évaluations) =======================
	   regles : tableau de chaînes ou d'objets :
	     "onlyWhile"      seule la boucle while est permise (ni for, ni do)
	     "noFor"          pas de for
	     "allman"         accolades seules sur leur ligne et alignées
	     "noFormat"       pas de String.format ni de printf
	     { noCallsIn: "contenu" }   la méthode ne doit appeler aucune méthode
	     { method: { name, ret, params: [types], stat, priv } }  méthode obligatoire
	     { calls: { from: "main", name: "repeter" } }  main doit appeler repeter
	     { forbid: ["repeat"], why: "..." }  identifiants interdits                    */
	function check(src, rules)
	{
		var msgs = [];
		if (!rules || !rules.length) { return msgs; }
		var toks, classes;
		try { toks = lex(src); classes = parse(src); }
		catch (e) { return msgs; } // les erreurs de compilation sont signalées par run()
		rules.forEach(function (r)
		{
			var name = typeof r === "string" ? r : Object.keys(r)[0];
			if (name === "onlyWhile" || name === "noFor")
			{
				toks.forEach(function (t)
				{
					if (t.type === "kw" && (t.v === "for" || (name === "onlyWhile" && t.v === "do")))
					{
						msgs.push("Ligne " + t.line + " : la boucle « " + t.v + " » est interdite dans cet exercice, seule la boucle while est autorisée.");
					}
				});
			}
			else if (name === "noFormat")
			{
				toks.forEach(function (t, i)
				{
					if (t.type === "id" && (t.v === "printf" || (t.v === "format" && toks[i - 1] && toks[i - 1].v === ".")))
					{
						msgs.push("Ligne " + t.line + " : " + t.v + " est interdit dans cet exercice (construis le texte toi-même).");
					}
				});
			}
			else if (name === "allman")
			{
				var stack = [];
				for (var i = 0; i < toks.length; i++)
				{
					var t = toks[i];
					if (t.type !== "op") { continue; }
					if (t.v === "{")
					{
						var prev = toks[i - 1];
						var init = prev && /^(=|,|\{|\]|\(|return)$/.test(prev.v);
						stack.push({ init: init, tok: t });
						if (init) { continue; }
						if (!t.first) { msgs.push("Ligne " + t.line + " : l'accolade { doit être seule sur sa ligne (style Allman)."); }
						else if (prev && t.indent !== prev.indent) { msgs.push("Ligne " + t.line + " : l'accolade { doit être alignée avec l'instruction de la ligne " + prev.line + "."); }
						var nx = toks[i + 1];
						if (nx && nx.line === t.line && nx.type !== "eof") { msgs.push("Ligne " + t.line + " : rien ne doit suivre l'accolade { sur la même ligne."); }
					}
					else if (t.v === "}")
					{
						var open = stack.pop();
						if (!open || open.init) { continue; }
						if (!t.first) { msgs.push("Ligne " + t.line + " : l'accolade } doit être seule sur sa ligne."); }
						else if (t.indent !== open.tok.indent) { msgs.push("Ligne " + t.line + " : l'accolade } doit être alignée avec l'accolade { de la ligne " + open.tok.line + "."); }
						var nx2 = toks[i + 1];
						if (nx2 && nx2.line === t.line && nx2.type !== "eof" && nx2.v !== ";") { msgs.push("Ligne " + t.line + " : « " + nx2.v + " » doit passer à la ligne suivante (style Allman)."); }
					}
				}
			}
			else if (name === "noCallsIn")
			{
				var target = r.noCallsIn;
				classes.forEach(function (c)
				{
					(c.methods[target] || []).forEach(function (m)
					{
						walk(m.body, function (n)
						{
							if (n.k === "call") { msgs.push("Ligne " + n.line + " : la méthode " + target + " ne doit appeler aucune autre méthode (ici : " + n.name + ")."); }
							if (n.k === "new" && n.cls !== "String") { msgs.push("Ligne " + n.line + " : la méthode " + target + " ne doit appeler aucune méthode (ici : new " + n.cls + ")."); }
						});
					});
				});
			}
			else if (name === "method")
			{
				var spec = r.method, found = null;
				classes.forEach(function (c) { (c.methods[spec.name] || []).forEach(function (m) { found = found || m; }); });
				var sig = (spec.priv ? "private " : "") + (spec.stat ? "static " : "") + spec.ret + " " + spec.name + "(" + spec.params.join(", ") + ")";
				if (!found) { msgs.push("La méthode " + sig + " est obligatoire."); }
				else
				{
					var okSig = found.ret === spec.ret && found.params.length === spec.params.length &&
						found.params.every(function (p, k) { return p.t === spec.params[k]; }) &&
						(spec.stat === undefined || found.stat === spec.stat) && (spec.priv === undefined || found.priv === spec.priv);
					if (!okSig) { msgs.push("Ligne " + found.line + " : la signature attendue est " + sig + "."); }
				}
			}
			else if (name === "calls")
			{
				var cs = r.calls, ok = false;
				classes.forEach(function (c)
				{
					(c.methods[cs.from] || []).forEach(function (m) { walk(m.body, function (n) { if (n.k === "call" && n.name === cs.name) { ok = true; } }); });
				});
				if (!ok) { msgs.push("La méthode " + cs.from + " doit appeler " + cs.name + "(...)."); }
			}
			else if (name === "once")
			{
				var nb = toks.filter(function (t) { return t.type === "id" && t.v === r.once; });
				if (nb.length > 1) { msgs.push("Il faut un seul appel à " + r.once + " (tu en as " + nb.length + ", lignes " + nb.map(function (t) { return t.line; }).join(", ") + ")."); }
			}
			else if (name === "forbid")
			{
				toks.forEach(function (t)
				{
					if ((t.type === "id" || t.type === "kw") && r.forbid.indexOf(t.v) >= 0) { msgs.push("Ligne " + t.line + " : " + t.v + " est interdit dans cet exercice" + (r.why ? " (" + r.why + ")" : "") + "."); }
				});
			}
		});
		return msgs;
	}

	return { run: run, check: check, parse: parse, lex: lex, fmtDouble: fmtDouble };
})();

if (typeof module !== "undefined") { module.exports = JavaMini; }

import iut.algo.Clavier;

public class Pascal
{
    public static void main(String[] args)
    {
        int n;
        int[][] tri;
        String ligne;

        System.out.print("Rang : ");
        n = Clavier.lire_int();
        tri = new int[n][n];

        for (int l = 0; l < n; l++)
        {
            tri[l][0] = 1;
            tri[l][l] = 1;
            for (int c = 1; c < l; c++)
            {
                tri[l][c] = tri[l - 1][c - 1] + tri[l - 1][c];
            }
        }

        for (int l = 0; l < n; l++)
        {
            ligne = "";
            for (int c = 0; c <= l; c++)
            {
                ligne = ligne + tri[l][c];
                if (c < l)
                {
                    ligne = ligne + " ";
                }
            }
            System.out.println(ligne);
        }
    }
}`) }

public class Classement
{
    static void afficher(int[] t)
    {
        for (int i = 0; i < t.length; i++)
        {
            System.out.print(t[i] + " ");
        }
        System.out.println();
    }

    static void trier(int[] temps)
    {
        int val;
        int j;
        for (int i = 1; i < temps.length; i++)
        {
            val = temps[i];
            j = i - 1;
            while (j >= 0 && temps[j] > val)
            {
                temps[j + 1] = temps[j];
                j--;
            }
            temps[j + 1] = val;
        }
    }

    public static void main(String[] args)
    {
        int[] temps = { 312, 287, 345, 290, 301 };

        afficher(temps);
        trier(temps);
        afficher(temps);
    }
}`) },

import iut.algo.Clavier;

public class Casier
{
    static int chercher(int[] num, int val)
    {
        int min = 0;
        int max = num.length - 1;
        int milieu;
        int res = -1;
        while (min <= max && res == -1)
        {
            milieu = (min + max) / 2;
            if (num[milieu] == val)
            {
                res = milieu;
            }
            else if (num[milieu] < val)
            {
                min = milieu + 1;
            }
            else
            {
                max = milieu - 1;
            }
        }
        return res;
    }

    public static void main(String[] args)
    {
        int[] num = { 1203, 1580, 2214, 3007, 4410, 5121, 6033, 7450, 8090 };
        int val;
        int ind;

        System.out.print("Numéro du livre : ");
        val = Clavier.lire_int();
        ind = chercher(num, val);
        if (ind == -1)
        {
            System.out.println("Livre absent");
        }
        else
        {
            System.out.println("Casier " + ind);
        }
    }

import iut.algo.Clavier;

public class Casier
{
    static int chercher(int[] num, int val)
    {
        int min = 0;
        int max = num.length - 1;
        int milieu;
        int res = -1;
        while (min <= max && res == -1)
        {
            milieu = (min + max) / 2;
            if (num[milieu] == val)
            {
                res = milieu;
            }
            else if (num[milieu] < val)
            {
                min = milieu + 1;
            }
            else
            {
                max = milieu - 1;
            }
        }
        return res;
    }

    static int nbTours(int[] num, int val)
    {
        int min = 0;
        int max = num.length - 1;
        int milieu;
        int tours = 0;
        boolean trouve = false;
        while (min <= max && !trouve)
        {
            tours++;
            milieu = (min + max) / 2;
            if (num[milieu] == val)
            {
                trouve = true;
            }
            else if (num[milieu] < val)
            {
                min = milieu + 1;
            }
            else
            {
                max = milieu - 1;
            }
        }
        return tours;
    }

    public static void main(String[] args)
    {
        int[] num = { 1203, 1580, 2214, 3007, 4410, 5121, 6033, 7450, 8090 };
        int val;
        int ind;

        System.out.print("Numéro du livre : ");
        val = Clavier.lire_int();
        ind = chercher(num, val);
        if (ind == -1)
        {
            System.out.println("Livre absent");
        }
        else
        {
            System.out.println("Casier " + ind);
        }
        System.out.println("Dichotomie : " + nbTours(num, val) + " tours");
        if (ind == -1)
        {
            System.out.println("Case par case : " + num.length + " cases");
        }
        else
        {
            System.out.println("Case par case : " + (ind + 1) + " cases");
        }
    }
}`) }

            i++;
        }

public class Releve
{
    static int premierNegatif(int[] t)
    {
        int i = 0;
        while (i < t.length && t[i] >= 0)
        {
            i++;
        }
        if (i == t.length)
        {
            i = -1;
        }
        return i;
    }

    static int sommePositifs(int[] t)
    {
        int somme = 0;
        for (int i = 0; i < t.length; i++)
        {
            if (t[i] > 0)
            {
                somme += t[i];
            }
        }
        return somme;
    }

    public static void main(String[] args)
    {
        int[] temp = { 4, 2, 0, -3, 1, -5 };
        int[] doux = { 8, 11, 9 };

        System.out.println("temp : premier négatif " + premierNegatif(temp) + ", somme des positifs " + sommePositifs(temp));
        System.out.println("doux : premier négatif " + premierNegatif(doux) + ", somme des positifs " + sommePositifs(doux));
    }
}`) }

public class Parking
{
    private boolean[] places;

    public Parking(int nbPlaces)
    {
        this.places = new boolean[nbPlaces];
    }

    public int garer(int place)
    {
        if (place < 0 || place >= this.places.length)
        {
            return -1;
        }
        if (this.places[place])
        {
            return -2;
        }
        this.places[place] = true;
        return 0;
    }

    public int garer()
    {
        for (int i = 0; i < this.places.length; i++)
        {
            if (!this.places[i])
            {
                this.places[i] = true;
                return i;
            }
        }
        return -3;
    }

    public int liberer(int place)
    {
        if (place < 0 || place >= this.places.length)
        {
            return -1;
        }
        if (!this.places[place])
        {
            return -4;
        }
        this.places[place] = false;
        return 0;
    }

    public String toString()
    {
        String s = "[";
        for (int i = 0; i < this.places.length; i++)
        {
            if (this.places[i])
            {
                s = s + "X";
            }
            else
            {
                s = s + ".";
            }
        }
        return s + "]";
    }
}`) },

<script>
(function ()
{
"use strict";
/* ==========================================================================
   JavaQuest : cœur de l'appli
   (outils d'affichage, coloration, sauvegarde, XP et série, langues, navigation)
   Ce fichier, exercices.js et app.js sont assemblés dans une seule fonction
   par build.js : ils partagent les mêmes variables.
   Tout le texte est inséré avec textContent : aucun contenu n'est interprété
   comme du HTML.
   ========================================================================== */

/* ---------- Petits outils DOM ---------- */
function h(tag, props)
{
	var e = document.createElement(tag);
	props = props || {};
	Object.keys(props).forEach(function (k)
	{
		var v = props[k];
		if (v === null || v === undefined || v === false) { return; }
		if (k === "class") { e.className = v; }
		else if (k === "text") { e.textContent = v; }
		else if (k === "on") { Object.keys(v).forEach(function (ev) { e.addEventListener(ev, v[ev]); }); }
		else if (k === "style") { e.setAttribute("style", v); }
		else if (k in e && typeof v !== "string") { e[k] = v; }
		else { e.setAttribute(k, v === true ? "" : v); }
	});
	for (var i = 2; i < arguments.length; i++) { add(e, arguments[i]); }
	return e;
}
function add(e, c)
{
	if (c === null || c === undefined || c === false) { return; }
	if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
	if (typeof c === "string" || typeof c === "number") { e.appendChild(document.createTextNode(String(c))); return; }
	e.appendChild(c);
}
function clear(e) { while (e.firstChild) { e.removeChild(e.firstChild); } return e; }

/* Texte riche minimal : `code` devient <code>, **gras** devient <strong>. */
function rich(txt)
{
	var frag = document.createDocumentFragment();
	String(txt).split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(function (part)
	{
		if (!part) { return; }
		if (part[0] === "`") { frag.appendChild(h("code", { "class": "inline", text: part.slice(1, -1) })); }
		else if (part.slice(0, 2) === "**") { frag.appendChild(h("strong", { text: part.slice(2, -2) })); }
		else { frag.appendChild(document.createTextNode(part)); }
	});
	return frag;
}
function para(txt) { return String(txt).split(/\n\n/).map(function (p) { return h("p", null, rich(p)); }); }

/* ---------- Coloration syntaxique, une expression par langage ----------
   Groupes : 1 commentaire, 2-3 chaîne, 4 nombre, 5 mot-clé, 6 type/balise.  */
var SYNTAX = {
	java: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|\b(\d+(?:\.\d+)?[LdDf]?)\b|\b(public|private|protected|static|final|void|int|double|char|boolean|long|short|float|byte|class|new|return|if|else|while|do|for|switch|case|default|break|continue|this|null|true|false|import)\b|\b(String|Clavier|System|Math|Integer|Double|Character)\b/g,
	pseudo: /(\/\/[^\n]*)|("(?:[^"\n])*")|('(?:[^'\n])*')|\b(\d+(?:[.,]\d+)?)\b|(\b(?:ALGORITHME|DEBUT|FIN|CONSTANTE|CONSTANTES|VARIABLE|VARIABLES|si|alors|sinon|fsi|tant que|ftq|faire|pour|de|à|pas|fpour|répéter|jusqu'à|selon|cas|autrement|fselon|lire|écrire|et|ou|non|vrai|faux|retourner|fonction|procédure|fin|entier|réel|caractère|chaîne|booléen|tableau)\b|←)/g,
	html: /(<!--[\s\S]*?-->|\/\*[\s\S]*?\*\/)|("(?:[^"\n])*")|('(?:[^'\n])*')|(#[0-9a-fA-F]{3,6}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%)?)|(<\/?[a-zA-Z][a-zA-Z0-9]*|\/?>)|(\b[a-z-]+(?==)|\b[a-z-]+(?=\s*:))/g
};
var curMode = "java"; // langage du contenu affiché (changé par l'appli)
function highlight(code, mode)
{
	if (mode === true) { mode = "pseudo"; }
	var re = SYNTAX[mode || curMode] || SYNTAX.java;
	var frag = document.createDocumentFragment(), last = 0, m;
	re.lastIndex = 0;
	while ((m = re.exec(code)) !== null)
	{
		if (m[0] === "") { re.lastIndex++; continue; }
		if (m.index > last) { frag.appendChild(document.createTextNode(code.slice(last, m.index))); }
		var cls = m[1] ? "t-com" : (m[2] || m[3]) ? "t-str" : m[4] ? "t-num" : m[5] ? "t-kw" : "t-type";
		frag.appendChild(h("span", { "class": cls, text: m[0] }));
		last = re.lastIndex;
	}
	if (last < code.length) { frag.appendChild(document.createTextNode(code.slice(last))); }
	return frag;
}
function codeBlock(code, mode, label)
{
	var md = mode === true ? "pseudo" : (mode || curMode);
	var names = { java: "Code Java", pseudo: "Pseudo-code", html: "Code HTML" };
	return h("pre", { "class": "code", tabindex: "0", "aria-label": label || names[md] || "Code" }, highlight(code, md));
}
/* Sortie de programme : les saisies (balisées \u0001...\u0002) en gras. */
function outputBlock(out, label)
{
	var pre = h("pre", { "class": "code out", tabindex: "0", "aria-label": label || "Sortie du programme" });
	String(out).split(/(\u0001[^\u0002]*\u0002)/).forEach(function (part)
	{
		if (!part) { return; }
		if (part[0] === "\u0001") { pre.appendChild(h("span", { "class": "t-in", text: part.slice(1, -1), title: "saisie au clavier" })); }
		else { pre.appendChild(document.createTextNode(part)); }
	});
	if (!out) { pre.appendChild(h("span", { "class": "muted", text: "(rien n'est affiché)" })); }
	return pre;
}

/* ---------- Sauvegarde (localStorage, protégé par try/catch) ---------- */
var KEY = "javaquest-s1-v1";
/* Code du mode admin. Le site tourne entièrement dans le navigateur : ce code
   cache les outils aux élèves, il ne protège rien (il est lisible dans la source). */
var ADMIN_CODE = "iut-admin";
function freshState(theme)
{
	return { xp: 0, done: {}, failed: {}, lives: {}, badges: {}, code: {}, tries: {}, ctl: {}, lessons: {}, days: {}, rev: {}, hints: {}, goal: 20, langue: "java", unlockAll: false, admin: false, theme: theme || "auto", backup: "" };
}
var state = freshState();
try
{
	var raw = window.localStorage.getItem(KEY);
	if (raw) { var saved = JSON.parse(raw); Object.keys(state).forEach(function (k) { if (saved[k] !== undefined) { state[k] = saved[k]; } }); }
}
catch (e) { /* navigation privée ou stockage bloqué : la progression ne sera pas gardée */ }
var saveTimer = null;
function save()
{
	clearTimeout(saveTimer);
	saveTimer = setTimeout(function ()
	{
		try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* stockage indisponible */ }
	}, 150);
}

/* ---------- Code de sauvegarde ----------
   La progression vit dans le navigateur (une origine = un stockage). Pour passer
   de l'artefact claude.ai à l'appli installée, ou de Safari à l'icône d'écran
   d'accueil sur iPhone, on transporte tout l'état dans un texte :
   « JQ2: » + base64 du JSON compressé (deflate), ou « JQ1: » + base64 du JSON
   si le navigateur ne sait pas compresser. Le JSON brut de l'export admin est
   accepté aussi. */
function bytesToB64(bytes)
{
	var s = "";
	for (var i = 0; i < bytes.length; i += 0x8000) { s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); }
	return btoa(s);
}
function b64ToBytes(b64)
{
	var s = atob(b64), out = new Uint8Array(s.length);
	for (var i = 0; i < s.length; i++) { out[i] = s.charCodeAt(i); }
	return out;
}
function pipeBytes(bytes, stream)
{
	return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
}
function saveCode()
{
	var bytes = new TextEncoder().encode(JSON.stringify(state));
	if (typeof CompressionStream === "function")
	{
		return pipeBytes(bytes, new CompressionStream("deflate-raw"))
			.then(function (z) { return "JQ2:" + bytesToB64(z); }, function () { return "JQ1:" + bytesToB64(bytes); });
	}
	return Promise.resolve("JQ1:" + bytesToB64(bytes));
}
/* Renvoie une promesse de l'objet sauvegardé, ou la rejette avec un message lisible. */
function readSaveCode(text)
{
	text = String(text || "").trim();
	function check(data)
	{
		if (!data || typeof data !== "object" || typeof data.xp !== "number" || typeof data.done !== "object") { throw new Error("Ce texte n'est pas une sauvegarde JavaQuest valide."); }
		return data;
	}
	try
	{
		if (text.charAt(0) === "{") { return Promise.resolve(check(JSON.parse(text))); }
		var m = /^JQ([12]):([A-Za-z0-9+\/=\s]+)$/.exec(text);
		if (!m) { return Promise.reject(new Error("Ce texte n'est pas un code JavaQuest (il commence par « JQ »).")); }
		var bytes = b64ToBytes(m[2].replace(/\s+/g, ""));
		var p;
		if (m[1] === "1") { p = Promise.resolve(bytes); }
		else if (typeof DecompressionStream === "function") { p = pipeBytes(bytes, new DecompressionStream("deflate-raw")); }
		else { return Promise.reject(new Error("Ce navigateur est trop ancien pour lire ce code. Ouvre-le dans un navigateur à jour.")); }
		return p.then(function (raw) { return check(JSON.parse(new TextDecoder().decode(raw))); })
			.catch(function (e) { throw new Error(e && /JavaQuest/.test(e.message) ? e.message : "Code abîmé ou incomplet : recopie-le en entier."); });
	}
	catch (e) { return Promise.reject(new Error("Code abîmé ou incomplet : recopie-le en entier.")); }
}
/* Remplace la progression par une sauvegarde. Le statut admin n'est jamais repris
   d'une sauvegarde : il reste celui de cet appareil (ou true pour l'import admin). */
function loadSave(data, admin)
{
	var fresh = freshState(state.theme);
	Object.keys(fresh).forEach(function (k) { if (data[k] !== undefined) { fresh[k] = data[k]; } });
	fresh.admin = admin === undefined ? state.admin : admin;
	fresh.theme = state.theme;
	state = fresh;
	migrateRev();
	save();
}
function saveSummary(data)
{
	var lec = Object.keys(data.lessons || {}).filter(function (k) { return data.lessons[k] && data.lessons[k].fait; }).length;
	var exo = Object.keys(data.done || {}).length;
	return "⭐ " + data.xp + " XP, " + lec + " leçon" + (lec > 1 ? "s" : "") + " terminée" + (lec > 1 ? "s" : "") + ", " + exo + " exercice" + (exo > 1 ? "s" : "") + " réussi" + (exo > 1 ? "s" : "") + ".";
}

/* ---------- XP, objectif du jour et série de jours ---------- */
function dayKey(d)
{
	d = d || new Date();
	return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayXp() { return state.days[dayKey()] || 0; }
function addXp(n)
{
	if (!n) { return; }
	state.xp += n;
	var k = dayKey();
	state.days[k] = (state.days[k] || 0) + n;
	save();
	refreshHeader();
}
/* Série : nombre de jours d'affilée avec au moins une leçon ou de l'XP.
   Si rien n'est fait aujourd'hui, la série d'hier compte encore. */
function streak()
{
	var d = new Date(), n = 0;
	if (!state.days[dayKey(d)]) { d.setDate(d.getDate() - 1); }
	while (state.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
	return n;
}

/* ---------- Langues ----------
   Chaque langue a ses unités (chapitres), ses contrôles et ses sujets bonus.
   runner : façon d'exécuter le code ("java" : interpréteur, "web" : aperçu HTML). */
var LANGS = (window.LANGUES || []).filter(function (l) { return !l.bientot; });
var ALL_LANGS = window.LANGUES || [];
function lang() { return LANGS.filter(function (l) { return l.id === state.langue; })[0] || LANGS[0]; }
var CH = [], CT = [], EV = [];
var EX = {}; // id d'exercice -> { ex, chap, langue, projet, controle, evaluation }
LANGS.forEach(function (L)
{
	(L.unites || []).forEach(function (c)
	{
		c.exos.forEach(function (e) { EX[e.id] = { ex: e, chap: c, langue: L }; });
		if (c.projet) { c.projet.etapes.forEach(function (e) { EX[e.id] = { ex: e, chap: c, langue: L, projet: c.projet }; }); }
	});
	(L.controles || []).forEach(function (ct) { ct.exos.forEach(function (e) { EX[e.id] = { ex: e, controle: ct, langue: L }; }); });
	(L.bonus || []).forEach(function (ev) { ev.etapes.forEach(function (e) { EX[e.id] = { ex: e, evaluation: ev, langue: L }; }); });
});
function useLang(L)
{
	CH = L.unites || [];
	CT = L.controles || [];
	EV = L.bonus || [];
	curMode = L.mode || "java";
}
useLang(lang());

/* ---------- Fenêtre modale ---------- */
function modal(icon, title, body, buttons)
{
	var prevFocus = document.activeElement;
	var back = h("div", { "class": "modal-back", role: "dialog", "aria-modal": "true", "aria-labelledby": "modalTitle" });
	function close() { back.remove(); if (prevFocus && prevFocus.focus) { prevFocus.focus(); } }
	var box = h("div", { "class": "modal" },
		h("div", { "class": "big", "aria-hidden": "true", text: icon }),
		h("h2", { id: "modalTitle", text: title }),
		para(body),
		h("div", { "class": "row", style: "justify-content:center" }, buttons.map(function (b, i)
		{
			return h("button", { "class": "btn" + (i ? " ghost" : ""), text: b.label, on: { click: function () { close(); if (b.action) { b.action(); } } } });
		})));
	back.appendChild(box);
	back.addEventListener("keydown", function (e)
	{
		if (e.key === "Escape") { close(); }
		if (e.key === "Tab")
		{
			var f = box.querySelectorAll("button");
			if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
			else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
		}
	});
	document.body.appendChild(back);
	box.querySelector("button").focus();
}

/* ---------- Récompenses communes aux exercices ---------- */
function solved(e, firstTry)
{
	if (state.done[e.id]) { return 0; }
	state.done[e.id] = true;
	var base = (e.k === "code" || e.k === "web") ? (e.xp || 20) : 10;
	var gain = firstTry && !state.failed[e.id] ? base : Math.ceil(base / 2);
	delete state.failed[e.id];
	addXp(gain);
	return gain;
}
function failed(e)
{
	if (!state.done[e.id]) { state.failed[e.id] = true; }
	if (e.k !== "code" && e.k !== "web") { state.rev[e.id] = { b: 0, d: dayKey(addDays(1)) }; }
	save();
}

/* ---------- Révision espacée ----------
   Une question ratée revient le lendemain. Réussie du premier coup en révision,
   elle revient de plus en plus tard (1, 3, 7, 14 puis 30 jours), puis sort de la
   liste. Ratée en révision, elle repart au début. */
var REV_JOURS = [1, 3, 7, 14, 30];
function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return d; }
function revDue(id) { var r = state.rev[id]; return !!r && r.d <= dayKey(); }
function revResult(id, ok)
{
	var r = state.rev[id] || { b: 0 };
	if (!ok) { state.rev[id] = { b: 0, d: dayKey(addDays(1)) }; }
	else if (r.b + 1 >= REV_JOURS.length) { delete state.rev[id]; }
	else { state.rev[id] = { b: r.b + 1, d: dayKey(addDays(REV_JOURS[r.b + 1])) }; }
	save();
}
/* anciennes sauvegardes : les questions ratées sont à revoir dès aujourd'hui */
function migrateRev() { if (!state.rev) { state.rev = {}; } if (!state.hints) { state.hints = {}; } Object.keys(state.failed).forEach(function (id) { if (!state.rev[id]) { state.rev[id] = { b: 0, d: dayKey() }; } }); }
migrateRev();

/* ---------- Navigation ----------
   La route courante est gardée en mémoire : si l'adresse ne peut pas changer
   (aperçu, page intégrée), on navigue quand même. */
var view = { chapIdx: {}, evalIdx: {}, revIdx: 0 };
var current = location.hash || "#/";
var timer = null;
var ROUTES = []; // [ [expression, fonction(correspondance)] ], rempli par app.js
function go(hash)
{
	current = hash;
	try { if (location.hash !== hash) { location.hash = hash; } } catch (e) { /* adresse non modifiable */ }
	route();
}
window.addEventListener("hashchange", function () { if ((location.hash || "#/") !== current) { current = location.hash || "#/"; route(); } });
function route()
{
	if (timer) { clearInterval(timer); timer = null; }
	clear(app);
	document.body.classList.remove("in-lesson");
	useLang(lang());
	var hsh = current || "#/";
	for (var i = 0; i < ROUTES.length; i++)
	{
		var m = hsh.match(ROUTES[i][0]);
		if (m) { ROUTES[i][1](m); break; }
	}
	updateTabs(hsh);
	refreshHeader();
	window.scrollTo(0, 0);
	var h1 = app.querySelector("h1");
	if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
}
function updateTabs(hsh)
{
	var tab = /^#\/(pratique|sandbox|exo|projet|eval|revision)/.test(hsh) ? "pratique" : /^#\/(profil|langues|admin)/.test(hsh) ? "profil" : "parcours";
	Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function (b)
	{
		var on = b.getAttribute("data-tab") === tab;
		b.classList.toggle("on", on);
		if (on) { b.setAttribute("aria-current", "page"); } else { b.removeAttribute("aria-current"); }
	});
}

/* ==========================================================================
   JavaQuest : les types d'exercices (QCM, prédire, trouver l'erreur, compléter,
   coder en Java, coder en HTML, schéma mémoire), les projets et les contrôles.
   ========================================================================== */
	/* ======================= Exercices ======================= */
	var KIND = { qcm: "QCM", predict: "Prédire la sortie", bug: "Trouver l'erreur", fill: "Compléter le code", code: "À toi de coder", memory: "Schéma mémoire", web: "À toi de coder" };

	function renderExercise(e, ctx)
	{
		var card = h("article", { "class": "card", "aria-label": KIND[e.k] + (ctx.num ? " " + ctx.num : "") });
		card.appendChild(h("div", { "class": "row between" },
			h("span", { "class": "kind", text: KIND[e.k] + (ctx.num ? " · " + ctx.num : "") }),
			(ctx.isDone ? ctx.isDone(e) : state.done[e.id]) ? h("span", { "class": "badge", text: "✓ réussi" }) : null));
		if (e.titre) { card.appendChild(h("h3", { text: e.titre })); }
		var fb = h("div", { "class": "feedback", role: "status", "aria-live": "polite" });
		var nextBtn = ctx.next ? h("button", { "class": "btn ghost", text: "Exercice suivant →", on: { click: ctx.next } }) : null;
		function feedback(kind, title, body, extra)
		{
			fb.className = "feedback show " + kind;
			clear(fb);
			fb.appendChild(h("h3", { text: title }));
			if (body) { add(fb, para(body)); }
			add(fb, extra);
		}
		var api = {
			win: function (expl, extra)
			{
				var first = !(state.tries[e.id] > 0);
				var g = solved(e, first);
				feedback("ok", "Bonne réponse" + (g ? " · +" + g + " XP" : ""), expl, extra);
				if (ctx.onSolved) { ctx.onSolved(); }
			},
			lose: function (title, expl, extra)
			{
				state.tries[e.id] = (state.tries[e.id] || 0) + 1;
				failed(e);
				feedback("ko", title, expl, extra);
				if (ctx.onFail && ctx.lives && e.k !== "code" && e.k !== "web") { ctx.onFail(); }
				if (ctx.onAnyFail) { ctx.onAnyFail(); }
			},
			info: function (title, body, extra) { feedback("info", title, body, extra); }
		};
		var body = ({ qcm: exQcm, predict: exPredict, bug: exBug, fill: exFill, code: exCode, memory: exMemory, web: exWeb })[e.k](e, api, { exam: !!ctx.exam });
		card.appendChild(body);
		if (state.admin) { card.appendChild(adminAnswer(e)); }
		card.appendChild(fb);
		if (nextBtn) { card.appendChild(h("div", { "class": "row", style: "margin-top:12px;justify-content:flex-end" }, nextBtn)); }
		return card;
	}

	/* Mode admin : la réponse attendue, sous chaque exercice */
	function adminAnswer(e)
	{
		var d = h("details", { "class": "given admin-ans" }, h("summary", { text: "🔑 Réponse (admin) · " + e.id }));
		if (e.k === "qcm") { d.appendChild(h("p", null, rich(e.opts[e.a]))); }
		else if (e.k === "fill") { d.appendChild(h("p", null, e.trous.map(function (t, i) { return "Trou " + (i + 1) + " : " + t.join(" ou "); }).join("  ·  "))); }
		else if (e.k === "bug") { d.appendChild(h("p", null, "Ligne " + e.ligne + " : ", h("code", { "class": "inline", text: e.fix[0] }))); }
		else if (e.k === "predict")
		{
			var r = JavaMini.run(wrapSnippet(e.code), { inputs: e.inputs || [], seed: 7 });
			d.appendChild(outputBlock(r.error ? "ERREUR : " + r.error.msg : r.out, "Sortie attendue"));
		}
		else if (e.k === "code" || e.k === "web") { d.appendChild(codeBlock(e.solution, e.k === "web" ? "html" : undefined, "Solution")); }
		else if (e.k === "memory")
		{
			var lignes = [];
			(e.pile || []).forEach(function (f) { f.vars.forEach(function (v) { if (v.a !== undefined || v.aref !== undefined) { lignes.push(f.cadre + " · " + v.n + " = " + (v.aref !== undefined ? "→ " + v.aref : [].concat(v.a)[0])); } }); });
			(e.tas || []).forEach(function (o) { (o.champs || o.vars || o.cases || []).forEach(function (v) { if (v.a !== undefined || v.aref !== undefined) { lignes.push(o.id + " · " + (v.n !== undefined ? v.n : "") + " = " + (v.aref !== undefined ? "→ " + v.aref : [].concat(v.a)[0])); } }); });
			d.appendChild(h("ul", null, lignes.map(function (l) { return h("li", { text: l }); })));
		}
		return d;
	}

	/* --- QCM --- */
	function exQcm(e, api)
	{
		var box = h("div");
		box.appendChild(h("p", { "class": "q" }, rich(e.q)));
		if (e.code) { box.appendChild(codeBlock(e.code)); }
		var opts = h("div", { "class": "opts", role: "group", "aria-label": "Réponses possibles" });
		// Les réponses sont mélangées à chaque affichage (dans le contenu, la bonne est souvent la première)
		var order = e.opts.map(function (o, i) { return i; });
		for (var k = order.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)); var tmp = order[k]; order[k] = order[r]; order[r] = tmp; }
		var buttons = e.opts.map(function (o, i)
		{
			return h("button", { "class": "opt", on: { click: function () { answer(i); } } }, rich(o));
		});
		add(opts, order.map(function (i) { return buttons[i]; }));
		box.appendChild(opts);
		function answer(i)
		{
			buttons.forEach(function (b) { b.disabled = true; });
			buttons[e.a].classList.add("good");
			var why = e.why && e.why[i] ? e.why[i] + "\n\n" : "";
			if (i === e.a) { api.win(e.expl); }
			else

/* ---------- Vérification du contenu ---------- */
function adminVerif()
{
	var out = h("div");
	function verifier()
	{
		clear(out);
		var nb = 0, pb = [];
		Object.keys(EX).forEach(function (id)
		{
			var e = EX[id].ex;
			if (EX[id].langue !== lang()) { return; }
			nb++;
			if (e.k === "qcm" && !(e.a >= 0 && e.a < e.opts.length)) { pb.push(id + " : réponse hors des options"); }
			if (e.k === "fill" && e.code.split("___").length - 1 !== e.trous.length) { pb.push(id + " : nombre de trous différent du nombre de réponses"); }
			if (e.k === "bug" && (e.ligne < 1 || e.ligne > e.code.split("\n").length)) { pb.push(id + " : ligne fautive hors du code"); }
			if (e.k === "predict")
			{
				var rp = JavaMini.run(wrapSnippet(e.code), { inputs: e.inputs || [], seed: 7 });
				if (rp.error) { pb.push(id + " : " + rp.error.msg); }
			}
			if (e.k === "code")
			{
				if (!e.solution) { pb.push(id + " : pas de solution"); return; }
				var b = buildSource(e, e.solution);
				var regles = JavaMini.check(b.ruleSrc, e.regles || []);
				if (regles.length) { pb.push(id + " : la solution viole ses règles (" + regles.join(" ; ") + ")"); }
				(e.tests || [{ "in": [] }]).forEach(function (t)
				{
					var r = JavaMini.run(b.src, { inputs: t["in"] || [], seed: t.seed || 7, fileName: e.fichier ? e.fichier.replace(/\.java$/, "") : undefined });
					if (r.error) { pb.push(id + " (" + (t["in"] || []).join(", ") + ") : " + r.error.msg); }
				});
			}
		});
		out.appendChild(h("p", { "class": pb.length ? "err" : "", style: "font-weight:700", text: nb + " exercices vérifiés · " + (pb.length ? pb.length + " problème(s)" : "aucun problème") }));
		if (pb.length) { out.appendChild(h("ul", { "class": "small" }, pb.map(function (p) { return h("li", { text: p }); }))); }
	}
	app.appendChild(h("section", { "class": "card" }, h("h2", { text: "Vérifier le contenu" }),
		h("p", { "class": "small muted", text: "Exécute chaque solution et chaque « prédire la sortie » avec l'interpréteur, et contrôle les réponses des QCM, des trous et des erreurs. (La comparaison avec le vrai Java se fait avec node validate.js --javac.)" }),

/* ==========================================================================
   JavaQuest : l'appli (chemin de leçons, lecteur de leçon, pratique, profil)
   Chaque unité (chapitre) est découpée automatiquement en leçons courtes :
     📖 Découvrir     : cartes d'explication + premières questions
     🎯 S'entraîner   : le reste des questions
     ⌨️ Coder         : les exercices où l'on écrit du vrai code
   puis le mini-projet et les contrôles, en étapes facultatives.

/* ---------- Découpage des unités en leçons ---------- */
function isCode(e) { return e.k === "code" || e.k === "web"; }
function lessonsOf(c)
{
	if (c._lecons) { return c._lecons; }
	var quiz = c.exos.filter(function (e) { return !isCode(e); });
	var code = c.exos.filter(isCode);
	var cartes = c.idee.map(function (t, i) { return { carte: true, titre: c.titre, num: i + 1, texte: t }; });
	var exemple = { carte: true, exemple: true, titre: "Exemple à lire", ex: c.exemple };
	var moitie = Math.ceil(quiz.length / 2);
	var A = quiz.slice(0, moitie), B = quiz.slice(moitie);
	var items = [];
	if (cartes[0]) { items.push(cartes[0]); }
	if (A[0]) { items.push(A[0]); }
	if (cartes[1]) { items.push(cartes[1]); }
	if (A[1]) { items.push(A[1]); }
	if (cartes[2]) { items.push(cartes[2]); }
	items.push(exemple);
	items = items.concat(A.slice(2));
	var L = [{ id: c.id + "-1", kind: "decouvrir", titre: "Découvrir", items: items, unite: c }];
	if (B.length) { L.push({ id: c.id + "-2", kind: "entrainer", titre: "S'entraîner", items: [{ carte: true, rappel: true, titre: "Rappel", lignes: c.idee }].concat(B), unite: c }); }
	if (code.length)
	{
		L.push({ id: c.id + "-3", kind: "coder", titre: "Coder", unite: c, items: [{ carte: true, titre: "À toi de coder", texte: "Dans cette leçon, tu écris du vrai code. Il est exécuté ici, dans le navigateur, puis comparé à ce qui est attendu. Les cœurs ne sont pas en jeu : essaie, lis les erreurs et corrige. C'est comme ça qu'on apprend." }].concat(code) });
	}
	c._lecons = L;
	return L;
}
var KIND_ICON = { decouvrir: "📖", entrainer: "🎯", coder: "⌨️", projet: "🧩", controle: "⏱", final: "🏆" };
function allLessons() { var out = []; CH.forEach(function (c) { out = out.concat(lessonsOf(c)); }); return out; }
function lessonDone(id) { return !!(state.lessons[id] && state.lessons[id].fait); }
function lessonOpen(l)
