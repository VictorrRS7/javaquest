	if (allOpen()) { return true; }
	var all = allLessons(), i = all.indexOf(l);
	return i <= 0 || lessonDone(all[i - 1].id);
}
function uniteDone(c) { return lessonsOf(c).every(function (l) { return lessonDone(l.id); }); }
function chapIndex(id) { for (var i = 0; i < CH.length; i++) { if (CH[i].id === id) { return i; } } return -1; }
function ctlOpen(ct) { var i = chapIndex(ct.apres); return allOpen() || (i >= 0 && uniteDone(CH[i])); }
function ctlState(ct) { if (!state.ctl[ct.id]) { state.ctl[ct.id] = {}; } return state.ctl[ct.id]; }
function nextLesson() { var all = allLessons(); for (var i = 0; i < all.length; i++) { if (!lessonDone(all[i].id) && lessonOpen(all[i])) { return all[i]; } } return null; }
function findLesson(id) { var r = null; LANGS.forEach(function (L) { (L.unites || []).forEach(function (c) { lessonsOf(c).forEach(function (l) { if (l.id === id) { r = { l: l, langue: L }; } }); }); }); return r; }
function revOk(id) { var r = EX[id]; return r && r.chap && !r.projet && !isCode(r.ex) && r.langue === lang(); }
function reviewIds() { return Object.keys(state.rev).filter(function (id) { return revOk(id) && revDue(id); }); }

function bigProgress(titre, d, t, sous)

function count(list) { return list.filter(function (e) { return state.done[e.id]; }).length; }
function stats()
{
	var r = { lecons: [0, 0], quiz: [0, 0], code: [0, 0], projets: [0, 0], controles: [0, 0], bonus: [0, 0] };
	CH.forEach(function (c)
	{
		lessonsOf(c).forEach(function (l) { r.lecons[1]++; if (lessonDone(l.id)) { r.lecons[0]++; } });
		c.exos.forEach(function (e) { var k = isCode(e) ? "code" : "quiz"; r[k][1]++; if (state.done[e.id]) { r[k][0]++; } });
		if (c.projet) { r.projets[1] += c.projet.etapes.length; r.projets[0] += count(c.projet.etapes); }
	});
	CT.forEach(function (ct) { var b = ctlState(ct).best; r.controles[1]++; if (b && b.nb === b.total && !b.hors) { r.controles[0]++; } });

function lessonPlayer(cfg)
{
	// cfg : { id, titre, items, hearts (bool), onDone(stats), onQuit }
	document.body.classList.add("in-lesson");
	var queue = cfg.items.slice();
	var pos = 0, hearts = 3, requeued = {}, firstOk = {}, tried = {}, xp0 = state.xp, codeFails = 0;
	var questions = cfg.items.filter(function (x) { return !x.carte && !isCode(x); });
	var wrap = h("div", { "class": "lesson" });
	var bar = h("span");
	var heartsEl = h("span", { "class": "hearts", "aria-live": "polite" });
	var top = h("div", { "class": "lesson-top" },
		h("button", { "class": "iconbtn", "aria-label": "Quitter la leçon", text: "✕", on: { click: function ()
		{
			modal("✕", "Quitter la leçon ?", "Ce que tu as réussi reste acquis, mais la leçon ne sera pas marquée comme terminée.", [{ label: "Quitter", action: cfg.onQuit }, { label: "Continuer la leçon" }]);
		} } }),
		h("div", { "class": "lbar", role: "progressbar", "aria-label": "Avancement de la leçon" }, bar),
		heartsEl);
	var body = h("div", { "class": "lesson-body" });
	var cont = h("button", { "class": "btn big", text: "Continuer" });
	var skip = h("button", { "class": "btn ghost", text: "Passer pour l'instant", style: "display:none" });
	var foot = h("div", { "class": "lesson-foot" }, h("div", { "class": "lesson-foot-in" }, skip, cont));
	wrap.appendChild(top);
	wrap.appendChild(body);
	wrap.appendChild(foot);
	app.appendChild(wrap);
	function drawTop()
	{
		bar.style.width = Math.round(100 * pos / queue.length) + "%";
		clear(heartsEl);
		var cur = queue[pos];
		if (!cfg.hearts || (cur && isCode(cur))) { heartsEl.appendChild(h("span", { "class": "small muted", text: cfg.hearts ? "⌨️ pratique" : "" })); return; }
		heartsEl.setAttribute("aria-label", hearts + " cœur" + (hearts > 1 ? "s" : ""));
		for (var i = 0; i < 3; i++) { heartsEl.appendChild(h("span", { "class": i < hearts ? "" : "lost", "aria-hidden": "true", text: "♥" })); }
	}
	function setReady(on) { cont.disabled = !on; }
	function show()
	{
		drawTop();
		clear(body);
		skip.style.display = "none";
		codeFails = 0;
		var it = queue[pos];
		window.scrollTo(0, 0);
		if (it.carte) { body.appendChild(renderCard(it)); setReady(true); cont.focus({ preventScroll: true }); return; }
		setReady(false);
		body.appendChild(renderExercise(it, {
			lives: !!cfg.hearts,
			onSolved: function ()
			{
				if (!tried[it.id]) { firstOk[it.id] = true; if (cfg.onFirstOk) { cfg.onFirstOk(it.id); } }
				tried[it.id] = true;
				setReady(true);
				skip.style.display = "none";
			},
			onFail: function ()
			{
				hearts--;
				drawTop();
				if (hearts <= 0) { setTimeout(lost, 600); }
			},
			onAnyFail: function ()
			{
				tried[it.id] = true;
				if (isCode(it))
				{
					codeFails++;
					if (codeFails >= 2) { skip.style.display = ""; }
					return;
				}
				if (!requeued[it.id]) { requeued[it.id] = true; queue.push(it); }
				setReady(true);
			}
		}));
	}
	cont.addEventListener("click", function ()
	{
		if (cont.disabled) { return; }
		pos++;
		if (pos >= queue.length) { end(); } else { show(); }
	});
	skip.addEventListener("click", function () { pos++; if (pos >= queue.length) { end(); } else { show(); } });
	function lost()
	{
		clear(body);
		foot.remove();
		body.appendChild(h("div", { "class": "endcard" },
			h("div", { "class": "emoji", "aria-hidden": "true", text: "💔" }),
			h("h1", { text: "Plus de cœurs" }),
			h("p", { "class": "muted", text: "Relis les cartes d'explication, puis recommence la leçon. Les questions réussies restent acquises." }),
			h("div", { "class": "stack" },
				h("button", { "class": "btn big", text: "Recommencer la leçon", on: { click: function () { route(); } } }),
				h("button", { "class": "btn ghost", text: "Retour au parcours", on: { click: cfg.onQuit } }))));
	}
	function end()
	{
		bar.style.width = "100%";
		var nbQ = questions.length;
		var nbOk = questions.filter(function (q) { return firstOk[q.id]; }).length;
		var pct = nbQ ? Math.round(100 * nbOk / nbQ) : 100;
		var stats = { pct: pct, xp: 0 };
		var before = todayXp();
		if (cfg.onDone) { cfg.onDone(stats); }
		stats.xp = state.xp - xp0;
		foot.remove();
		clear(body);
		var goalNow = before < state.goal && todayXp() >= state.goal;
		body.appendChild(h("div", { "class": "endcard" },
			h("div", { "class": "emoji", "aria-hidden": "true", text: pct >= 80 ? "🎉" : "👍" }),
			h("h1", { text: cfg.finTitre || "Leçon terminée !" }),
			h("div", { "class": "tiles" },
				h("div", { "class": "tile" }, h("span", { "class": "tv", text: "+" + stats.xp }), h("span", { "class": "small muted", text: "XP" })),
				h("div", { "class": "tile" }, h("span", { "class": "tv", text: pct + " %" }), h("span", { "class": "small muted", text: "du premier coup" })),
				h("div", { "class": "tile" }, h("span", { "class": "tv", text: "🔥 " + streak() }), h("span", { "class": "small muted", text: "jours d'affilée" }))),
			goalNow ? h("p", { "class": "goal-msg", text: "🎯 Objectif du jour atteint !" }) : null,
			h("button", { "class": "btn big", text: "Continuer", on: { click: function () { (cfg.onNext || cfg.onQuit)(); } } })));
		body.querySelector(".btn").focus();
	}
	show();
}

function renderCard(it)

function renderLesson(m)
{
	var f = findLesson(m[1]);
	if (!f) { current = "#/"; renderPath(); return; }
	if (f.langue !== lang()) { state.langue = f.langue.id; useLang(f.langue); }
	var l = f.l, c = l.unite;
	if (!lessonOpen(l)) { current = "#/"; renderPath(); return; }
	lessonPlayer({
		id: l.id, items: l.items, hearts: l.kind !== "coder",
		onQuit: function () { go("#/"); },
		onDone: function (stats)
		{
			var prev = state.lessons[l.id];
			state.lessons[l.id] = { fait: true, best: Math.max(stats.pct, prev ? prev.best : 0), fois: (prev ? prev.fois : 0) + 1 };
			addXp(prev ? 3 : 10);
			if (uniteDone(c) && !state.badges[c.id])
			{
				state.badges[c.id] = true;
				addXp(50);
				setTimeout(function () { modal("★", "Badge « " + c.badge + " »", "Unité " + c.num + " terminée : +50 XP." + (c.projet ? " Le mini-projet « " + c.projet.titre + " » est ouvert." : ""), [{ label: "Super" }]); }, 300);

/* ---------- Sauvegarder / restaurer avec un code ---------- */
function renderBackup()
{
	var out = h("textarea", { "class": "answer", id: "bkOut", rows: "3", readonly: "readonly", spellcheck: "false", "aria-label": "Ton code de sauvegarde", hidden: "hidden" });
	var inp = h("textarea", { "class": "answer", id: "bkIn", rows: "3", spellcheck: "false", autocapitalize: "off", autocomplete: "off", placeholder: "Colle ici un code qui commence par JQ…" });
	var file = h("input", { type: "file", accept: ".txt,.json,text/plain,application/json", hidden: "hidden" });
	var msg = h("p", { "class": "small", role: "status" });
	function restore(text)
	{
		msg.textContent = "";
		readSaveCode(text).then(function (data)
		{
			modal("💾", "Restaurer cette sauvegarde ?", saveSummary(data) + "\n\nElle remplacera ta progression actuelle sur cet appareil (" + saveSummary(state) + ")", [
				{ label: "Restaurer", action: function () { loadSave(data); go("#/profil"); route(); } },
				{ label: "Annuler" }]);
		}, function (err) { msg.textContent = err.message; });
	}
	file.addEventListener("change", function ()
	{
		var f = file.files && file.files[0];
		if (!f) { return; }
		f.text().then(restore);
		file.value = "";
	});
	var copyBtn = h("button", { "class": "btn", text: "Créer mon code de sauvegarde", on: { click: function ()
	{
		saveCode().then(function (code)
		{
			state.backup = dayKey();
			save();
			out.value = code;
			out.hidden = false;
			out.focus();
			out.select();
			var done = function () { msg.textContent = "Code copié (" + Math.ceil(code.length / 1024) + " Ko de texte). Colle-le dans tes notes ou envoie-le-toi."; };
			if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code).then(done, function () { msg.textContent = "Code créé : sélectionne-le dans la case et copie-le."; }); }
			else { msg.textContent = "Code créé : sélectionne-le dans la case et copie-le."; }
			shareBtn.hidden = !navigator.share;
		});
	} } });
	var shareBtn = h("button", { "class": "btn ghost", text: "Partager…", hidden: "hidden", on: { click: function () { navigator.share({ title: "Sauvegarde JavaQuest", text: out.value }).catch(function () {}); } } });
	app.appendChild(h("section", { "class": "card stack" }, h("h2", { text: "💾 Sauvegarde" }),
		h("p", { "class": "small muted", text: "Ta progression est gardée sur cet appareil, dans ce navigateur. Pour la retrouver ailleurs (autre téléphone, appli installée, ordinateur), crée un code et colle-le là-bas. Aucune donnée n'est envoyée sur internet." }),
		h("p", { "class": "small", text: "Dernière sauvegarde : " + (state.backup ? state.backup.split("-").reverse().join("/") : "jamais") }),
		h("div", { "class": "row" }, copyBtn, shareBtn), out,
		h("label", { "class": "fld", "for": "bkIn", text: "Restaurer une sauvegarde" }), inp,
		h("div", { "class": "row" },
			h("button", { "class": "btn ghost", text: "Restaurer", on: { click: function () { restore(inp.value); } } }),
			h("button", { "class": "btn ghost", text: "Depuis un fichier", on: { click: function () { file.click(); } } }), file),
		msg));
}
